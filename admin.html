<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSW Extractor - 管理控制台</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 額外的頁面特定樣式 */
        .status-bar {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            display: none;
        }
        .status-error { background: rgba(231, 76, 60, 0.2); color: #ff4757; display: block; }
        .status-success { background: rgba(46, 204, 113, 0.2); color: #2ecc71; display: block; }
    </style>
</head>
<body>

<div class="container">
    <header style="margin-bottom: 30px;">
        <a href="index.html" style="color: var(--accent-blue); text-decoration: none;">← 返回控制中心</a>
        <h1>👕 裝備提取管理器</h1>
    </header>

    <div class="grid-layout" style="display: grid; grid-template-columns: 1fr 350px; gap: 20px;">
        
        <main>
            <div class="panel">
                <h3>🔍 玩家搜尋</h3>
                <div class="flex">
                    <input type="text" id="target_ppsn" placeholder="請輸入玩家 PPSN (例如: 203721000...)" style="flex-grow: 1;">
                    <button onclick="fetchPlayerEquips()">開始掃描</button>
                </div>
                <div id="fetch-status" class="status-bar"></div>
            </div>

            <div class="panel">
                <h3>📦 穿戴中的裝備</h3>
                <div id="equip_list" class="equip-grid">
                    <p style="color: var(--text-secondary); text-align: center; grid-column: 1/-1; padding: 40px;">
                        請在上方輸入 PPSN 並點擊掃描來獲取資料
                    </p>
                </div>
            </div>
        </main>

        <aside>
            <div class="panel">
                <h3>🔑 憑證設定</h3>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <label style="font-size: 12px; color: var(--text-secondary);">Access Token</label>
                    <input type="password" id="msw_token" placeholder="輸入 token">
                    
                    <label style="font-size: 12px; color: var(--text-secondary);">User ID</label>
                    <input type="text" id="msw_user_id" placeholder="輸入 user_id">
                    
                    <div class="mt-20" style="display: flex; flex-direction: column; gap: 10px;">
                        <button onclick="handleManualSave()">💾 手動儲存憑證</button>
                        
                        <div style="text-align: center; font-size: 12px; color: var(--text-secondary); margin: 5px 0;">或使用自動化助手</div>
                        
                        <button onclick="document.getElementById('import_file').click()" style="background: var(--online-green); color: black;">
                            📥 匯入 Token JSON
                        </button>
                        <input type="file" id="import_file" style="display:none" accept=".json" onchange="importTokenJson(this)">
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3>👥 已儲存帳號</h3>
                <div id="saved-accounts-list" style="display: flex; flex-direction: column; gap: 8px;">
                    </div>
            </div>
        </aside>
    </div>
</div>

<script src="js/account_manager.js"></script>
<script src="js/nexon_api.js"></script>

<script>
    // 初始化頁面
    window.onload = () => {
        const current = AccountManager.getCurrentAccount();
        if (current) {
            document.getElementById('msw_token').value = current.token;
            document.getElementById('msw_user_id').value = current.userId;
        }
        renderSavedAccounts();
    };

    // 處理手動儲存
    function handleManualSave() {
        const token = document.getElementById('msw_token').value.trim();
        const userId = document.getElementById('msw_user_id').value.trim();
        if (AccountManager.saveAccount(userId, token, "手動設定")) {
            alert("憑證已儲存！");
            location.reload();
        }
    }

    // 匯入由 Python 腳本產生的 JSON
    function importTokenJson(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.token && data.user_id) {
                    AccountManager.saveAccount(data.user_id, data.token, "自動助手匯入");
                    alert("✅ 憑證自動匯入成功！");
                    location.reload();
                }
            } catch (err) {
                alert("❌ JSON 格式解析失敗");
            }
        };
        reader.readAsText(file);
    }

    // 渲染帳號列表
    function renderSavedAccounts() {
        const accounts = AccountManager.getAccounts();
        const list = document.getElementById('saved-accounts-list');
        const currentId = localStorage.getItem('msw_current_user_id');

        if (accounts.length === 0) {
            list.innerHTML = '<p style="font-size:12px; color:#666;">尚未儲存任何帳號</p>';
            return;
        }

        list.innerHTML = accounts.map(acc => `
            <div style="padding: 10px; background: ${acc.userId === currentId ? 'var(--bg-input)' : 'transparent'}; border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer;" 
                 onclick="AccountManager.setCurrentAccount('${acc.userId}'); location.reload();">
                <div style="font-size: 13px; font-weight: bold;">${acc.nickname}</div>
                <div style="font-size: 10px; color: #666;">${acc.userId.substring(0, 15)}...</div>
            </div>
        `).join('');
    }

    // 執行掃描裝備
    async function fetchPlayerEquips() {
        const ppsn = document.getElementById('target_ppsn').value.trim();
        const statusBox = document.getElementById('fetch-status');
        const grid = document.getElementById('equip_list');

        if (!ppsn) return alert("請輸入目標玩家的 PPSN");

        statusBox.className = "status-bar";
        statusBox.innerText = "⏳ 正在與伺服器通訊...";
        statusBox.classList.add("status-success");

        try {
            const items = await NexonAPI.getEquipList(ppsn);
            grid.innerHTML = "";

            if (items.length === 0) {
                statusBox.className = "status-bar status-error";
                statusBox.innerText = "ℹ️ 該玩家目前沒有穿戴可提取的造型裝備";
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="thumb-container">
                        <img src="${item.itemThumbnailUrl}" alt="icon">
                    </div>
                    <div class="item-info">
                        <span class="item-type-tag">${item.avatarType}</span>
                        <div class="ruid-text">${item.ruid}</div>
                        <button onclick="navigator.clipboard.writeText('${item.ruid}'); alert('已複製 RUID')" 
                                style="width: 100%; font-size: 10px; padding: 5px; margin-top: 10px;">
                            複製 RUID
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });

            statusBox.className = "status-bar status-success";
            statusBox.innerText = `✅ 成功載入 ${items.length} 件裝備`;

        } catch (err) {
            statusBox.className = "status-bar status-error";
            if (err.message === "UNAUTHORIZED") {
                statusBox.innerText = "❌ 憑證無效 (401)，請重新匯入 Token";
            } else {
                statusBox.innerText = "❌ 請求失敗: " + err.message;
            }
        }
    }
</script>

</body>
</html>
