<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSW 裝備管理面板</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #121216;
            --card-bg: #1e1e24;
            --text-color: #ffffff;
            --accent-color: #7e69f5;
            --price-color: #4caf50;
            --label-color: #a0a0a0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Microsoft JhengHei", sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 詳情彈窗容器 */
        .modal-card {
            background: var(--card-bg);
            width: 380px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            color: var(--label-color);
            cursor: pointer;
            font-size: 20px;
        }

        /* 圖片預覽區 */
        .preview-box {
            background: #000000;
            width: 100%;
            height: 220px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated; /* 保持像素風格清晰 */
        }

        /* 資料行樣式 */
        .info-row {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .label {
            color: var(--label-color);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .value {
            font-size: 16px;
            font-weight: 500;
        }

        /* 價格特化樣式 */
        .price-text {
            color: var(--price-color);
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0;
        }
        .price-unit {
            font-size: 14px;
            margin-left: 4px;
            color: var(--label-color);
        }

        /* 複製區塊樣式 */
        .copy-wrapper {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 4px;
        }

        .truncate {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
            color: #ddd;
        }

        .copy-icon {
            color: #ffa726;
            cursor: pointer;
            padding-left: 10px;
            font-size: 14px;
        }

        /* 同步按鈕 */
        .sync-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .sync-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="modal-card" id="detailCard">
    <i class="fas fa-times close-btn"></i>

    <div class="preview-box">
        <img id="detailImg" src="" alt="裝備預覽">
    </div>

    <div class="info-row">
        <div class="info-header">
            <span class="label"><i class="fas fa-file-alt"></i> 商品名稱</span>
            <i class="fas fa-file-signature copy-icon" onclick="copyValue('detailName')"></i>
        </div>
        <span class="value" id="detailName">載入中...</span>
    </div>

    <div class="price-text">
        <span id="detailPrice">0</span><span class="price-unit">wc</span>
    </div>

    <div class="info-row">
        <span class="label"><i class="fas fa-user-tag"></i> 作者</span>
        <span class="value" id="detailAuthor">未知</span>
    </div>

    <div class="info-row">
        <div class="info-header">
            <span class="label"><i class="fas fa-fingerprint"></i> 商品 ID</span>
        </div>
        <div class="copy-wrapper">
            <span class="truncate" id="detailId">N/A</span>
            <i class="fas fa-file-signature copy-icon" onclick="copyValue('detailId')"></i>
        </div>
    </div>

    <div class="info-row">
        <div class="info-header">
            <span class="label"><i class="fas fa-link"></i> 縮圖</span>
        </div>
        <div class="copy-wrapper">
            <span class="truncate" id="detailThumbUrl">https://...</span>
            <i class="fas fa-file-signature copy-icon" onclick="copyValue('detailThumbUrl')"></i>
        </div>
    </div>

    <button class="sync-btn">
        🚀 同步至 GitHub
    </button>
</div>

<script src="nexon_api.js"></script>
<script>
    /**
     * 渲染資料到介面上的範例函數
     * 這裡的 item 物件應來自 NexonAPI.getEquipList() 的回傳結果
     */
    function renderItemDetail(item) {
        document.getElementById('detailImg').src = item.itemImageUrl;
        document.getElementById('detailName').innerText = item.itemName;
        document.getElementById('detailPrice').innerText = item.targetPrice.replace(' wc', '');
        document.getElementById('detailAuthor').innerText = item.nickname || "未知";
        document.getElementById('detailId').innerText = item.itemId;
        document.getElementById('detailThumbUrl').innerText = item.itemImageUrl;
    }

    /**
     * 複製功能
     */
    function copyValue(elementId) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text).then(() => {
            // 這裡可以加入一個簡單的提示效果
            console.log('已複製: ' + text);
        });
    }

</script>

</body>
</html>
