<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>造型查詢系統</title>
    <script src="js/nexon_api.js"></script>
    <script src="js/user_api.js"></script>
    <style>
    body { background-color: #0f0f12; color: #e4e4e7; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 20px; margin-bottom: 20px; }

    /* 搜尋區域：讓輸入框與按鈕高度一致 (48px) */
    .search-group { display: flex; gap: 10px; margin-bottom: 0px; }
    input { 
        background: #27272a; border: 1px solid #3b82f644; color: white; 
        padding: 0 16px; border-radius: 8px; width: 100%; box-sizing: border-box; 
        outline: none; height: 48px; font-size: 16px; flex: 1;
    }
    button { 
        cursor: pointer; border: none; border-radius: 8px; font-weight: 600; 
        transition: 0.2s; height: 48px; display: flex; align-items: center; justify-content: center; width: auto;
    }
    .btn-primary { background: #3b82f6; color: white; width: 140px; } /* 固定按鈕寬度 */
    .btn-save { background: #10b981; color: white; width: 100%; margin-top: 10px; }
    .btn-sync { background: #7359cc; color: white; width: 100%; margin-top: 15px; }

    /* 裝備列表樣式 */
    .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .item-card { background: #1c1c21; border-radius: 20px; padding: 24px; border: 1px solid #2d2d35; transition: transform 0.2s; }
    .thumb-box { background: #141419; border-radius: 12px; height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; overflow: hidden; }
    .thumb-box img { max-width: 100%; max-height: 140px; image-rendering: pixelated; }
    .price-text { font-size: 28px; color: rgb(102, 178, 127); font-weight: bold; margin-bottom: 15px; }
    .info-row { display: flex; align-items: center; margin-bottom: 10px; font-size: 13px; }
    .info-label { color: #808ca6; width: 85px; flex-shrink: 0; }
    .info-value { color: #ffffff; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'Consolas', monospace; }
    .copy-btn { background: #2d2d35; color: #fb923c; width: 32px; height: 28px; padding: 0; font-size: 12px; margin-left: 8px; border-radius: 4px; }
    
    #status-bar { padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid #3b82f633; }

    /* --- 更新：用戶資料區域 (圖二) --- */
    .profile-bar { 
        display: none; align-items: center; background: #1c1c21; 
        padding: 20px; border-radius: 12px; border: 1px solid #3b82f644; 
        margin-bottom: 20px; gap: 30px; 
    }
    .profile-avatar { 
        width: 72px; height: 72px; background: #000; 
        border-radius: 50%; border: 2px solid #3b82f6; object-fit: cover; 
    }
    /* 數值大字體樣式 */
    .profile-value { 
        font-size: 24px; font-weight: bold; color: #ffffff; 
        white-space: nowrap;
    }
    #p_code { color: #3b82f6; } /* Code 部分用藍色強調 */
    #p_ppsn { color: #808ca6; font-size: 20px; } /* PPSN 稍小一點點 */
</style>
</head>
<body>

<div class="container">
    <header><h1 style="color: #4ade80;">造型查詢系統</h1></header>
    <div style="display: grid; grid-template-columns: 1fr 350px; gap: 24px;">
        <div class="left">
            <div class="card">
                <h3 style="margin-top: 0;">🔍 玩家造型查詢</h3>
                <div class="search-group">
                    <input type="text" id="target_input" placeholder="輸入玩家 5碼ID 或 PPSN">
                    <button id="btn_search" class="btn-primary">搜尋玩家造型</button>
                </div>
            </div>
            
            <div id="status-bar"></div>
            
            <div id="target_profile" class="profile-bar">
                <img id="p_img" class="profile-avatar" src="" alt="avatar">
                <div id="p_name" class="profile-value"></div>
                <div id="p_code" class="profile-value"></div>
                <div id="p_ppsn" class="profile-value"></div>
            </div>
            
            <div id="equip_list" class="item-grid"></div>
        </div>
        <div class="right">
            <div class="card">
                <h3 style="margin-top: 0;">🔍 商品ID查詢</h3>
                <div class="search-group">
                    <input type="text" id="single_id_input" placeholder="輸入商品 ID">
                    <button id="btn_single_search" class="btn-primary" style="background: #7359cc; width: 100px;">搜尋ID造型</button>
                </div>
                </div>
            <div class="card">
                <h3>🔑 Token憑證</h3>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <h4 style="margin: 0;">Nexon 帳號</h4>
                        <input type="file" id="file_selector" accept=".json" style="display: none;">
                        <button id="btn_import" onclick="document.getElementById('file_selector').click()" style="background: #3f3f46; color: #4ade80; border: 1px solid #4ade80; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 11px;">📂 匯入帳號 JSON</button>
                    </div>
                <input type="password" id="token_input" placeholder="AccessToken">
                <input type="text" id="userid_input" placeholder="UserId">
                <p id="import_status" style="font-size: 11px; color: #4ade80; margin-top: 4px; display: none;"></p>
                <hr style="border:0; border-top:1px solid #27272a; margin:15px 0;">
                <h4>GitHub Token金鑰</h4>
                <input type="password" id="gh_token_input" placeholder="GitHub Personal Access Token">
                <p style="font-size:11px; color:#666; margin-top:4px;">* Token 不會儲存在程式碼中，僅存於此瀏覽器。</p>
                <button id="btn_save" class="btn-save" style="margin-top:10px;">💾 儲存Token資料</button>
            </div>
        </div>
    </div>
</div>

<script>
    const GITHUB_CONFIG = {
        owner: "xmasakix",
        repo: "MSW-ID",
        path: "data.json"
    };

    window.onload = () => {
        document.getElementById('target_input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                document.getElementById('btn_search').click();
            }
        });

        // 查詢 Enter 支援
        document.getElementById('single_id_input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                document.getElementById('btn_single_search').click();
            }
        });

        if (typeof NexonAPI === 'undefined') {
            const statusBar = document.getElementById('status-bar');
            if (statusBar) {
                statusBar.style.display = 'block';
                statusBar.innerText = "❌ 錯誤：無法載入 js/nexon_api.js";
            }
        }
        const savedGhToken = localStorage.getItem('github_token_v1');
        if (savedGhToken) document.getElementById('gh_token_input').value = savedGhToken;

        const savedAccounts = localStorage.getItem('msw_accounts_v1');
        if (savedAccounts) {
            try {
                const accounts = JSON.parse(savedAccounts);
                if (accounts.length > 0) {
                    document.getElementById('token_input').value = accounts[0].token || '';
                    document.getElementById('userid_input').value = accounts[0].userId || '';
                }
            } catch(e) { console.error("解析儲存帳號失敗", e); }
        }
        initImportFeature();
        
        // 🚀 核心更新：檢查網址參數（同時支援 Discord 帶過來的商品 ID 或玩家 ID）
        checkUrlParameters();
    };

    // 🚀 核心更新：解析網址參數並模擬自動點擊搜尋
    function checkUrlParameters() {
        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('search_id'); // 商品 ID 參數
        const playerId = urlParams.get('player_id'); // 新增：玩家 ID 參數
        
        // 狀況 A：如果網址帶有商品 ID
        if (targetId) {
            console.log(`🎯 偵測到商品 ID: ${targetId}，準備自動搜尋...`);
            const searchInput = document.getElementById("single_id_input"); 
            const searchButton = document.getElementById("btn_single_search");  
            if (searchInput && searchButton) {
                searchInput.value = targetId;
                setTimeout(() => { searchButton.click(); }, 500);
            }
        } 
        // 狀況 B：如果網址帶有玩家 ID (5碼或 PPSN)
        else if (playerId) {
            console.log(`🎯 偵測到網址帶有玩家 ID: ${playerId}，準備自動搜尋...`);
            const playerInput = document.getElementById("target_input");
            const playerButton = document.getElementById("btn_search");
            if (playerInput && playerButton) {
                playerInput.value = playerId;
                setTimeout(() => { playerButton.click(); }, 500);
            }
        }
    }

    function initImportFeature() {
        const fileSelector = document.getElementById('file_selector');
        const importStatus = document.getElementById('import_status');
        if (!fileSelector) return;

        fileSelector.onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = JSON.parse(event.target.result);
                    const currentId = data.current_account;
                    const accounts = data.accounts || [];
                    const activeAccount = accounts.find(acc => acc.user_id === currentId);
                    if (activeAccount) {
                        const token = activeAccount.access_token;
                        const userId = activeAccount.user_id;
                        document.getElementById('token_input').value = token;
                        document.getElementById('userid_input').value = userId;
                        if (importStatus) {
                            importStatus.innerText = `✅ 已自動儲存：${activeAccount.nickname || userId}`;
                            importStatus.style.display = 'block';
                        }
                        localStorage.setItem('msw_accounts_v1', JSON.stringify([{userId: userId, token: token}]));
                    } else {
                        alert('❌ 找不到目前啟用的帳號');
                    }
                } catch (err) { alert('❌ JSON 檔案解析失敗'); }
                fileSelector.value = '';
            };
            reader.readAsText(file);
        };
    }

    function copy(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
            const oldText = btn.innerText;
            btn.innerText = "OK";
            setTimeout(() => btn.innerText = oldText, 1000);
        });
    }

    document.getElementById('btn_save').onclick = () => {
        const nToken = document.getElementById('token_input').value.trim();
        const nUser = document.getElementById('userid_input').value.trim();
        const gToken = document.getElementById('gh_token_input').value.trim();
        if (nToken && nUser) localStorage.setItem('msw_accounts_v1', JSON.stringify([{userId: nUser, token: nToken}]));
        if (gToken) localStorage.setItem('github_token_v1', gToken);
        alert("所有憑證已同步至瀏覽器快取！");
    };

    // --- 商品ID查詢按鈕 ---
    document.getElementById('btn_single_search').onclick = async function() {
        const itemId = document.getElementById('single_id_input').value.trim();
        const grid = document.getElementById('equip_list');
        const status = document.getElementById('status-bar');
    
        if (!itemId) return;

        // 🚀 新增：當點擊搜尋商品時，靜態修改瀏覽器網址為 ?search_id=XXXXX 方便記錄與分享
        history.pushState(null, '', `?search_id=${itemId}`);

        status.style.display = "block";
        status.innerText = "🔍 正在搜尋造型資料...";
        grid.innerHTML = "";
    
        try {
            const res = await NexonAPI.getRealProductDetail(itemId);
            console.log("Nexon API 原始回傳值:", res);
    
            if (res && res.price !== "未上架") {
                const name = res.title || res.name || res.itemName || res.avatarName || 
                             (res.data && res.data.name) || (res.result && res.result.name) || "未知裝備";
    
                const imgUrl = res.iconUrl || res.itemImageUrl || res.itemThumbnailUrl || res.thumbnail || 
                               (res.data && res.data.thumbnail) || 
                               `https://mod-file.dn.nexoncdn.co/prime/inventory/icon/${itemId}`;
    
                const displayData = {
                    name: name,
                    price: res.price,
                    priceUnit: "wc",
                    itemId: res.itemId || itemId,
                    img: imgUrl,
                    authorDisplay: res.profileCode ? `${res.nickname}#${res.profileCode}` : (res.nickname || "未知作者"),
                    avatarType: res.avatarType || "",
                    sellerPpsn: res.sellerPpsn || "" // 🛠️ 前面修正的：補上作者 PPSN
                };
    
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="thumb-box">
                        <img src="${displayData.img}" onerror="this.src='https://mod-file.dn.nexon.com/prime/inventory/icon/${itemId}'">
                    </div>
                    <div class="info-row">
                        <div class="info-label">📝 名稱</div>
                        <div class="info-value">${displayData.name}</div>
                    </div>
                    <div class="price-text">${displayData.price} <span style="font-size:14px;color:#888">wc</span></div>
                    <div class="info-row"><div class="info-label">👤 上傳者</div><div class="info-value">${displayData.authorDisplay}</div></div>
                    <div class="info-row"><div class="info-label">🆔 商品 ID</div><div class="info-value">${displayData.itemId}</div></div>
                    <div class="info-row">
                        <div class="info-label">🖼️ 網址</div>
                        <div class="info-value">${displayData.img}</div>
                        <button class="copy-btn" onclick="copy('${displayData.img}', this)">📋</button>
                    </div>
                    <button class="btn-sync">🚀 同步至 GitHub</button>
                `;
    
                card.querySelector('.btn-sync').onclick = (e) => sync(e.target, displayData);
                grid.appendChild(card);
                status.innerText = "✅ 掃描完成";
            } else {
                status.innerText = "⚠️ 找不到該商品";
            }
        } catch (err) {
            status.innerText = "❌ 查詢錯誤: " + err.message;
        }
    };
    
    // --- 玩家造型查詢按鈕 ---
    document.getElementById('btn_search').onclick = async function() {
        const input = document.getElementById('target_input').value.trim();
        const status = document.getElementById('status-bar');
        const grid = document.getElementById('equip_list');
        const pBar = document.getElementById('target_profile');

        if (!input) return;

        // 🚀 新增：當點擊搜尋玩家時，靜態修改瀏覽器網址為 ?player_id=XXXXX 方便記錄與分享
        history.pushState(null, '', `?player_id=${input}`);

        status.style.display = "block";
        status.innerText = "🔄 正在搜尋玩家造型...";
        grid.innerHTML = "";
        pBar.style.display = "none";

        try {
            UserAPI.getProfile(input).then(data => {
                pBar.style.display = "flex";
                document.getElementById('p_img').src = data.profileImageUrl;
                document.getElementById('p_name').innerText = data.nickname;
                document.getElementById('p_code').innerText = `#${data.profileCode}`;
                document.getElementById('p_ppsn').innerText = data.ppsn;
            }).catch(e => {
                console.error("玩家造型載入失敗 請重新載入Token", e);
            });

            const rawItems = await NexonAPI.getEquipList(input);
            
            if (!rawItems || rawItems.length === 0) {
                status.innerText = "⚠️ 找不到玩家穿戴中的造型";
                return;
            }

            for (let item of rawItems) {
                const realData = await NexonAPI.getRealProductDetail(item.itemId || item.itemName);
                const displayData = {
                    name: item.itemName,
                    price: realData?.price !== undefined ? realData.price : "未知",
                    priceUnit: (realData && realData.price !== "未上架") ? "wc" : "",
                    itemId: realData?.itemId || item.itemId || "未上架",
                    img: item.itemImageUrl || item.itemThumbnailUrl,
                    sellerPpsn: realData?.sellerPpsn || "", 
                    authorDisplay: (realData && realData.profileCode) 
                        ? `${realData.nickname}#${realData.profileCode}` 
                        : (realData?.nickname || "未上架"),
                    avatarType: item.avatarType
                };

                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="thumb-box"><img src="${displayData.img}"></div>
                    <div class="info-row">
                        <div class="info-label">📝 名稱</div>
                        <div class="info-value">${displayData.name}</div>
                        <button class="copy-btn" onclick="copy('${displayData.name}', this)">📋</button>
                    </div>
                    <div class="price-text">${displayData.price} <span style="font-size:14px;color:#888">${displayData.priceUnit}</span></div>
                    <div class="info-row">
                        <div class="info-label">👤 上傳者</div>
                        <div class="info-value">${displayData.authorDisplay}</div>
                        <button class="copy-btn" onclick="copy('${displayData.authorDisplay}', this)">📋</button>
                    </div>
                    <div class="info-row">
                        <div class="info-label">🆔 商品 ID</div>
                        <div class="info-value">${displayData.itemId}</div>
                        <button class="copy-btn" onclick="copy('${displayData.itemId}', this)">📋</button>
                    </div>
                    <div class="info-row">
                        <div class="info-label">🖼️ 網址</div>
                        <div class="info-value">${displayData.img}</div>
                        <button class="copy-btn" onclick="copy('${displayData.img}', this)">📋</button>
                    </div>
                    <button class="btn-sync">🚀 同步至正版商品ID網站</button>
                `;

                card.querySelector('.btn-sync').onclick = (e) => sync(e.target, displayData);
                grid.appendChild(card);
            }
            status.innerText = `✅ 已同步完成 (${new Date().toLocaleTimeString()})`;
        } catch (err) {
            status.innerText = "❌ 錯誤: " + err.message;
        }
    };

    async function sync(btn, itemData) {
        const originalText = btn.innerText;
        btn.innerText = "⏳ 同步中...";
        btn.disabled = true;
        try {
            const token = localStorage.getItem('github_token_v1');
            const { owner, repo, path } = GITHUB_CONFIG;
            if (!token) throw new Error("請先儲任 GitHub Token");

            const getUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const commonHeaders = {
                "Authorization": `Bearer ${token.trim()}`,
                "Accept": "application/vnd.github.v3+json"
            };

            const res = await fetch(getUrl, { headers: commonHeaders });
            let sha = "";
            let currentItems = [];
            
            if (res.ok) {
                const fileData = await res.json();
                sha = fileData.sha;
                const cleanBase64 = fileData.content.replace(/\s/g, '');
                const decodedContent = decodeURIComponent(escape(atob(cleanBase64)));
                currentItems = JSON.parse(decodedContent);
            }

            const newData = {
                "id": String(itemData.itemId),
                "img": itemData.img,
                "keyword": itemData.name,
                "wc": (itemData.price === "未知" || itemData.price === "未上架") ? 0 : parseInt(itemData.price),
                "author": String(itemData.sellerPpsn || ""),
                "avatartype": itemData.avatarType || ""
            };

            const existsIndex = currentItems.findIndex(i => String(i.id) === newData.id);
            if (existsIndex > -1) currentItems[existsIndex] = newData;
            else currentItems.push(newData);

            const jsonString = JSON.stringify(currentItems, null, 2);
            const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

            const putRes = await fetch(getUrl, {
                method: "PUT",
                headers: { ...commonHeaders, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: `📦 Update: ${newData.keyword}`,
                    content: encodedContent,
                    sha: sha
                })
            });

            if (!putRes.ok) throw new Error("GitHub 上傳失敗");
            btn.innerText = "✅ 已同步成功";
            setTimeout(() => { btn.innerText = originalText; btn.disabled = false; }, 2000);
        } catch (err) {
            alert("❌ 失敗: " + err.message);
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
