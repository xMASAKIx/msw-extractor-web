<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSW 裝備管理器 Pro</title>
    <style>
        body { background-color: #0f0f12; color: #e4e4e7; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        input { background: #27272a; border: 1px solid #3f3f46; color: white; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; outline: none; }
        button { cursor: pointer; border: none; border-radius: 8px; padding: 12px; font-weight: 600; width: 100%; transition: 0.2s; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-save { background: #10b981; color: white; }

        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .item-card { background: #1c1c21; border-radius: 20px; padding: 24px; border: 1px solid #2d2d35; transition: transform 0.2s; }
        .item-card:hover { transform: translateY(-5px); border-color: #4ade80; }
        
        .thumb-box { background: #141419; border-radius: 12px; height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; border: 1px solid #27272a; overflow: hidden; }
        .thumb-box img { max-width: 100%; max-height: 140px; image-rendering: pixelated; }

        .price-text { font-size: 28px; color: rgb(102, 178, 127); font-weight: bold; margin-bottom: 15px; display: flex; align-items: baseline; gap: 4px; }
        .price-unit { font-size: 14px; color: #809980; }

        .info-row { display: flex; align-items: center; margin-bottom: 10px; font-size: 13px; }
        .info-label { color: #808ca6; width: 85px; flex-shrink: 0; }
        .info-value { color: #ffffff; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'Consolas', monospace; }
        
        .copy-btn { background: #2d2d35; color: #fb923c; width: 32px; height: 28px; padding: 0; font-size: 12px; margin-left: 8px; border-radius: 4px; flex-shrink: 0; }
        .btn-sync { background: #7359cc; color: white; margin-top: 15px; }
        
        #status-bar { padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid #3b82f633; }
    </style>
</head>
<body>

<div class="container">
    <header><h1 style="color: #4ade80;">👕 MSW 裝備提取管理器</h1></header>

    <div style="display: grid; grid-template-columns: 1fr 350px; gap: 24px;">
        <div class="left">
            <div class="card">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="target_input" placeholder="輸入 5 碼 ID (例如: 12345) 或 PPSN">
                    <button id="btn_search" class="btn-primary" style="width: 120px;">掃描裝備</button>
                </div>
                <div id="status-bar"></div>
            </div>
            <div id="equip_list" class="item-grid"></div>
        </div>

        <div class="right">
            <div class="card">
                <h3>🔑 憑證管理</h3>
                <input type="password" id="token_input" placeholder="AccessToken">
                <input type="text" id="userid_input" placeholder="UserId">
                <button id="btn_save" class="btn-save">💾 儲存並刷新</button>
            </div>
        </div>
    </div>
</div>

<script>
    const NexonAPI = {
        getHeaders: () => {
            const accounts = JSON.parse(localStorage.getItem('msw_accounts_v1') || '[]');
            const currentAccount = accounts[0] || { userId: '', token: '' };
            return {
                "mod-accesstoken": currentAccount.token,
                "mod-user-id": currentAccount.userId,
                "x-mod-client": "727d112f1370415e85686530ec048fb7",
                "Accept": "application/json",
                "Content-Type": "application/json",
                "Cache-Control": "no-cache, no-store, must-revalidate",
                "Pragma": "no-cache"
            };
        },

        async proxyFetch(url) {
            // 每次請求都生成全新的隨機參數，強制代理伺服器重新抓取資料
            const cacheBuster = `&nocache=${Date.now()}_${Math.random().toString(36).substring(7)}`;
            const finalUrl = url + cacheBuster;
            
            // 使用 allorigins /get 並開啟 disableCache 參數
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(finalUrl)}&disableCache=true`;

            try {
                const response = await fetch(proxyUrl, { 
                    headers: this.getHeaders(),
                    cache: 'no-store' 
                });
                const res = await response.json();
                
                // allorigins 的資料在 contents 中，且為字串格式
                const data = typeof res.contents === 'string' ? JSON.parse(res.contents) : res.contents;
                
                if (data?.code === 401 || data?.code === 403) throw new Error("憑證失效，請更新憑證");
                return data;
            } catch (e) {
                console.error("代理請求失敗:", e);
                return null;
            }
        },

        async getPpsnByCode(profileCode) {
            const url = `https://mverse-api.nexon.com/profile/v1/profileCode/${profileCode}`;
            const json = await this.proxyFetch(url);
            if (json?.data?.ppsn) return json.data.ppsn;
            throw new Error("找不到該玩家，請檢查 5 碼 ID");
        },

        async getRealProductDetail(itemName) {
            const searchUrl = `https://mod-gateway-prd-tokyo-2.nexon.com/mverse/v1/shop/mod/sale/avatars/search?sort=1&filterType=ALL&registeredType=CREATOR&size=1&searchAvatarName=${encodeURIComponent(itemName)}`;
            try {
                const res = await this.proxyFetch(searchUrl);
                // 根據 Log，資料可能在 res.data.items[0]
                const items = res?.data?.items || res?.list || [];
                if (items.length > 0) {
                    const d = items[0];
                    return {
                        price: d.itemPrice ?? d.targetPrice ?? 0,
                        sellerPpsn: d.sellerPpsn || "N/A",
                        nickname: d.nickname || "未知",
                        itemId: d.itemId || d.id
                    };
                }
            } catch (e) { console.error("商城校對失敗", e); }
            return null;
        },

        async getEquipList(input) {
            let ppsn = input.trim();
            if (ppsn.length === 5) ppsn = await this.getPpsnByCode(ppsn);

            const url = `https://mod-gateway-prd-tokyo-2.nexon.com/mverse/v1/shop/mod/inventory/avatars/manage/equip/list/${ppsn}`;
            const json = await this.proxyFetch(url);
            const whitelist = ["HAIR", "HAT", "CAPE", "TOP", "GLOVE", "OVERALL", "BOTTOM", "SHOES"];
            return (json?.data?.items || []).filter(item => whitelist.includes(item.avatarType));
        }
    };

    const GITHUB_CONFIG = {
        token: "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",
        owner: "xmasakix",
        repo: "MSW-ID",
        path: "data.json"
    };

    function copy(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
            btn.innerText = "OK";
            setTimeout(() => btn.innerText = "📋", 1000);
        });
    }

    document.getElementById('btn_search').onclick = async function() {
        const input = document.getElementById('target_input').value.trim();
        const status = document.getElementById('status-bar');
        const grid = document.getElementById('equip_list');

        if (!input) return;
        status.style.display = "block";
        status.innerText = "⏳ 正在抓取穿戴清單...";
        grid.innerHTML = "";

        try {
            const rawItems = await NexonAPI.getEquipList(input);
            
            for (let item of rawItems) {
                status.innerText = `⏳ 正在即時抓取商城資料: ${item.itemName}...`;
                
                const realData = await NexonAPI.getRealProductDetail(item.itemName);
                
                // 優先使用真實抓到的資料，抓不到才用原本的
                const displayData = {
                    name: item.itemName,
                    price: realData ? realData.price : "未知",
                    priceUnit: realData ? "wc" : "",
                    itemId: realData ? realData.itemId : (item.itemId || "未上架"),
                    img: item.itemImageUrl || item.itemThumbnailUrl,
                    author: realData ? realData.nickname : "未知",
                    sellerPpsn: realData ? realData.sellerPpsn : "未上架"
                };

                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="thumb-box"><img src="${displayData.img}"></div>                    
                    <div class="info-row"><div class="info-label">📝 名稱</div><div class="info-value">${displayData.name}</div></div>
                    <div class="price-text">${displayData.price} <span class="price-unit">${displayData.priceUnit}</span></div>
                    
                    <div class="info-row">
                        <div class="info-label">👤 作者 PPSN</div>
                        <div class="info-value" title="${displayData.sellerPpsn}">${displayData.sellerPpsn}</div>
                        <button class="copy-btn" onclick="copy('${displayData.sellerPpsn}', this)">📋</button>
                    </div>

                    <div class="info-row">
                        <div class="info-label">🆔 商品 ID</div>
                        <div class="info-value">${displayData.itemId}</div>
                        <button class="copy-btn" onclick="copy('${displayData.itemId}', this)">📋</button>
                    </div>
                    <div class="info-row">
                        <div class="info-label">🖼️ 縮圖網址</div>
                        <div class="info-value" title="${displayData.img}">${displayData.img}</div>
                        <button class="copy-btn" onclick="copy('${displayData.img}', this)">📋</button>
                    </div>
                    <button class="btn-sync">🚀 同步至 GitHub</button>
                `;

                card.querySelector('.btn-sync').onclick = (e) => sync(e.target, displayData);
                grid.appendChild(card);
            }
            status.innerText = `✅ 掃描完成，已繞過快取取得最新資料`;
        } catch (err) {
            status.innerText = "❌ 錯誤: " + err.message;
        }
    };

    async function sync(btn, data) {
        if (data.itemId === "未上架") return alert("此裝備未上架，無法同步");
        btn.disabled = true;
        btn.innerText = "⏳ 同步中...";
        try {
            const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
            const res = await fetch(url, { headers: { "Authorization": `token ${GITHUB_CONFIG.token}` } });
            const json = await res.json();
            const list = JSON.parse(decodeURIComponent(escape(atob(json.content))));

            if (list.some(i => String(i.id) === String(data.itemId))) throw new Error("ID 已存在");

            list.push({
                "keyword": data.name,
                "wc": data.price === "未知" ? "未知" : data.price + "wc",
                "id": String(data.itemId),
                "author_ppsn": data.sellerPpsn,
                "img": data.img
            });

            await fetch(url, {
                method: "PUT",
                headers: { "Authorization": `token ${GITHUB_CONFIG.token}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: `Add: ${data.name} (Price: ${data.price})`,
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(list, null, "\t")))),
                    sha: json.sha
                })
            });
            btn.innerText = "✅ 成功";
        } catch (err) {
            alert(err.message);
            btn.innerText = "🚀 失敗";
            btn.disabled = false;
        }
    }

    document.getElementById('btn_save').onclick = () => {
        const t = document.getElementById('token_input').value.trim();
        const u = document.getElementById('userid_input').value.trim();
        if (t && u) {
            localStorage.setItem('msw_accounts_v1', JSON.stringify([{userId: u, token: t}]));
            alert("憑證已更新！");
            location.reload();
        }
    };
</script>
</body>
</html>
