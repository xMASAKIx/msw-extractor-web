<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MSW 裝備管理器 Pro</title>
    <script src="js/nexon_api.js"></script>
    <style>
        body { background-color: #0f0f12; color: #e4e4e7; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        input { background: #27272a; border: 1px solid #3f3f46; color: white; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; outline: none; }
        button { cursor: pointer; border: none; border-radius: 8px; padding: 12px; font-weight: 600; width: 100%; transition: 0.2s; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-save { background: #10b981; color: white; }
        
        .profile-bar { 
            display: none; 
            align-items: center; 
            gap: 15px; 
            background: #1c1c21; 
            padding: 15px 20px; 
            border-radius: 12px; 
            border: 1px solid #3b82f644; 
            margin-bottom: 20px; 
        }
        .profile-img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #3b82f6; object-fit: cover; background: #000; }
        .p-info { display: flex; flex-direction: column; gap: 4px; }
        .p-name { font-size: 20px; font-weight: bold; color: #fff; }
        .p-sub { display: flex; align-items: center; gap: 10px; }
        .p-code { color: #3b82f6; font-family: monospace; font-size: 16px; font-weight: bold; }
        .p-ppsn { color: #808ca6; font-size: 13px; font-family: monospace; }

        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .item-card { background: #1c1c21; border-radius: 20px; padding: 24px; border: 1px solid #2d2d35; transition: transform 0.2s; }
        .thumb-box { background: #141419; border-radius: 12px; height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; overflow: hidden; }
        .thumb-box img { max-width: 100%; max-height: 140px; image-rendering: pixelated; }
        .price-text { font-size: 28px; color: rgb(102, 178, 127); font-weight: bold; margin-bottom: 15px; }
        .info-row { display: flex; align-items: center; margin-bottom: 10px; font-size: 13px; }
        .info-label { color: #808ca6; width: 85px; flex-shrink: 0; }
        .info-value { color: #ffffff; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'Consolas', monospace; }
        .copy-btn { background: #2d2d35; color: #fb923c; width: 32px; height: 28px; padding: 0; font-size: 12px; margin-left: 8px; border-radius: 4px; border: none; cursor: pointer; }
        .btn-sync { background: #7359cc; color: white; margin-top: 15px; width: 100%; cursor: pointer; border-radius: 8px; padding: 12px; border: none; }
        #status-bar { padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid #3b82f633; }
    </style>
</head>
<body>

<div class="container">
    <header><h1 style="color: #4ade80;">👕 MSW 裝備提取管理器</h1></header>
    <div style="display: grid; grid-template-columns: 1fr 350px; gap: 24px;">
        <div class="left">
            <div class="card">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="target_input" placeholder="輸入 5 碼 ID (如: bpt0p)" style="height: 45px; margin-bottom: 0;">
                    <button id="btn_search" class="btn-primary" style="width: 150px; height: 45px;">掃描裝備</button>
                </div>
                <div id="status-bar" style="margin-top: 15px;"></div>
            </div>

            <div id="target_profile" class="profile-bar">
                <img id="p_img" src="" class="profile-img">
                <div class="p-info">
                    <div id="p_name" class="p-name">載入中...</div>
                    <div class="p-sub">
                        <div id="p_code" class="p-code">#-----</div>
                        <div id="p_ppsn" class="p-ppsn"></div>
                    </div>
                </div>
            </div>

            <div id="equip_list" class="item-grid"></div>
        </div>
        
        <div class="right">
            <div class="card">
                <h3>🔑 憑證管理</h3>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <h4 style="margin: 0; font-size: 12px; color: #808ca6;">Nexon 帳號</h4>
                    <input type="file" id="file_selector" accept=".json" style="display: none;">
                    <button onclick="document.getElementById('file_selector').click()" style="background: #3f3f46; color: #4ade80; border: 1px solid #4ade80; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;">📂 匯入帳號 JSON</button>
                </div>
                <input type="password" id="token_input" placeholder="AccessToken">
                <input type="text" id="userid_input" placeholder="UserId">
                <p id="import_status" style="font-size: 11px; color: #4ade80; margin-top: 4px; display: none;"></p>
                <hr style="border:0; border-top:1px solid #27272a; margin:15px 0;">
                <h4 style="margin: 10px 0 8px 0; color: #808ca6; font-size: 12px;">GitHub 配置</h4>
                <input type="password" id="gh_token_input" placeholder="GitHub Personal Access Token">
                <button id="btn_save" class="btn-save" style="margin-top:10px;">💾 儲存所有憑證</button>
            </div>
        </div>
    </div>
</div>

<script>
    const GITHUB_CONFIG = { owner: "xmasakix", repo: "MSW-ID", path: "data.json" };

    window.onload = () => {
        const savedGhToken = localStorage.getItem('github_token_v1');
        if (savedGhToken) document.getElementById('gh_token_input').value = savedGhToken;
        const savedAccounts = localStorage.getItem('msw_accounts_v1');
        if (savedAccounts) {
            try {
                const accounts = JSON.parse(savedAccounts);
                if (accounts.length > 0) {
                    document.getElementById('token_input').value = accounts[0].token || '';
                    document.getElementById('userid_input').value = accounts[0].userId || '';
                }
            } catch(e) {}
        }
        initImportFeature();
    };

    document.getElementById('target_input').onkeydown = (e) => {
        if (e.key === 'Enter') document.getElementById('btn_search').click();
    };

    function initImportFeature() {
        const fileSelector = document.getElementById('file_selector');
        fileSelector.onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = JSON.parse(event.target.result);
                    const activeAccount = data.accounts.find(acc => acc.user_id === data.current_account);
                    if (activeAccount) {
                        document.getElementById('token_input').value = activeAccount.access_token;
                        document.getElementById('userid_input').value = activeAccount.user_id;
                        localStorage.setItem('msw_accounts_v1', JSON.stringify([{userId: activeAccount.user_id, token: activeAccount.access_token}]));
                        document.getElementById('import_status').innerText = `✅ 已自動儲存：${activeAccount.nickname}`;
                        document.getElementById('import_status').style.display = 'block';
                    }
                } catch (err) { alert('❌ JSON 解析失敗'); }
            };
            reader.readAsText(file);
        };
    }

    function copy(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
            const oldText = btn.innerText;
            btn.innerText = "OK";
            setTimeout(() => btn.innerText = oldText, 1000);
        });
    }

    document.getElementById('btn_save').onclick = () => {
        const nToken = document.getElementById('token_input').value.trim();
        const nUser = document.getElementById('userid_input').value.trim();
        const gToken = document.getElementById('gh_token_input').value.trim();
        if (nToken && nUser) localStorage.setItem('msw_accounts_v1', JSON.stringify([{userId: nUser, token: nToken}]));
        if (gToken) localStorage.setItem('github_token_v1', gToken);
        alert("憑證已儲存！");
    };

    document.getElementById('btn_search').onclick = async function() {
        const input = document.getElementById('target_input').value.trim();
        const status = document.getElementById('status-bar');
        const grid = document.getElementById('equip_list');
        const pBar = document.getElementById('target_profile');
        if (!input) return;

        status.style.display = "block";
        status.innerText = "🔄 正在提取資料...";
        grid.innerHTML = "";
        pBar.style.display = "none";

        try {
            // 【修正重點】直接利用搜尋時的 ID 獲取其對應的 PPSN
            // 這裡假設你的 NexonAPI 本身就有一個能根據 ID 獲取 Profile (包含 PPSN) 的功能
            // 如果你的 getEquipList 本身就支援 5 碼 ID，我們通常可以從返回的資料獲取
            
            let targetPPSN = "";
            
            // 先嘗試獲取該搜尋 ID 的基本資料以取得 PPSN
            // 如果你原本的代碼是用 getEquipList 來啟動，我們維持流程
            const rawItems = await NexonAPI.getEquipList(input);
            
            if (!rawItems || rawItems.length === 0) {
                status.innerText = "⚠️ 找不到穿戴中的裝備";
                return;
            }

            // 從搜尋對象的資料中直接取得 PPSN (而不是從商品 seller 拿)
            // 根據你圖二的邏輯，通常 rawItems 裡會帶有該玩家的 ppsn
            targetPPSN = rawItems[0].ppsn || rawItems[0].worldPpsn || input; 

            // 如果 input 本身長得像 PPSN (17位數字)，就直接用；如果是 5 碼 ID，則需要轉換
            // 這裡我加入一個邏輯：如果抓到的資料裡有明確的玩家 PPSN，就用那個
            
            if (targetPPSN) {
                pBar.style.display = "flex";
                document.getElementById('p_ppsn').innerText = targetPPSN;
                
                // 帶入圖二指定的 API
                fetch(`https://mverse-api.nexon.com/social/v1/profile/${targetPPSN}`)
                    .then(res => res.json())
                    .then(pData => {
                        if (pData && pData.data) {
                            document.getElementById('p_img').src = pData.data.profileImageUrl || '';
                            document.getElementById('p_name').innerText = pData.data.nickname || '未知';
                            document.getElementById('p_code').innerText = `#${pData.data.profileCode || ''}`;
                        }
                    })
                    .catch(e => console.error("圖二 MVerse API 請求失敗", e));
            }

            // 渲染裝備列表 (完全保留原本邏輯)
            for (let item of rawItems) {
                const realData = await NexonAPI.getRealProductDetail(item.itemId || item.itemName);
                const displayData = {
                    name: item.itemName,
                    price: realData?.price !== undefined ? realData.price : "未知",
                    priceUnit: (realData && realData.price !== "未上架") ? "wc" : "",
                    itemId: realData?.itemId || item.itemId || "未上架",
                    img: item.itemImageUrl || item.itemThumbnailUrl,
                    sellerPpsn: realData?.sellerPpsn || "", 
                    authorDisplay: (realData && realData.profileCode) ? `${realData.nickname}#${realData.profileCode}` : (realData?.nickname || "未上架")
                };

                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="thumb-box"><img src="${displayData.img}"></div>
                    <div class="info-row"><div class="info-label">📝 名稱</div><div class="info-value">${displayData.name}</div><button class="copy-btn" onclick="copy('${displayData.name}', this)">📋</button></div>
                    <div class="price-text">${displayData.price} <span style="font-size:14px;color:#888">${displayData.priceUnit}</span></div>
                    <div class="info-row"><div class="info-label">👤 作者</div><div class="info-value">${displayData.authorDisplay}</div><button class="copy-btn" onclick="copy('${displayData.authorDisplay}', this)">📋</button></div>
                    <div class="info-row"><div class="info-label">🆔 商品 ID</div><div class="info-value">${displayData.itemId}</div><button class="copy-btn" onclick="copy('${displayData.itemId}', this)">📋</button></div>
                    <div class="info-row"><div class="info-label">🖼️ 縮圖網址</div><div class="info-value">${displayData.img}</div><button class="copy-btn" onclick="copy('${displayData.img}', this)">📋</button></div>
                    <button class="btn-sync">🚀 同步至 GitHub</button>
                `;
                card.querySelector('.btn-sync').onclick = (e) => sync(e.target, displayData);
                grid.appendChild(card);
            }
            status.innerText = `✅ 提取完成 (${new Date().toLocaleTimeString()})`;
        } catch (err) { 
            status.innerText = "❌ 錯誤: " + err.message; 
        }
    };

    async function sync(btn, itemData) {
        const originalText = btn.innerText;
        btn.innerText = "⏳ 同步中...";
        btn.disabled = true;
        try {
            const token = localStorage.getItem('github_token_v1');
            const { owner, repo, path } = GITHUB_CONFIG;
            if (!token) throw new Error("請先儲存 GitHub Token");
            const getUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const headers = { "Authorization": `Bearer ${token.trim()}`, "Accept": "application/vnd.github.v3+json" };
            const res = await fetch(getUrl, { headers });
            let sha = ""; let currentItems = [];
            if (res.ok) {
                const fileData = await res.json();
                sha = fileData.sha;
                currentItems = JSON.parse(decodeURIComponent(escape(atob(fileData.content.replace(/\s/g, '')))));
            }
            const newData = { "id": String(itemData.itemId), "img": itemData.img, "keyword": itemData.name, "wc": (itemData.price === "未知" || itemData.price === "未上架") ? 0 : parseInt(itemData.price), "author": String(itemData.sellerPpsn || "") };
            const existsIndex = currentItems.findIndex(i => String(i.id) === newData.id);
            if (existsIndex > -1) currentItems[existsIndex] = newData; else currentItems.push(newData);
            const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(currentItems, null, 2))));
            const putRes = await fetch(getUrl, { method: "PUT", headers: { ...headers, "Content-Type": "application/json" }, body: JSON.stringify({ message: `📦 Update: ${newData.keyword}`, content: encoded, sha: sha }) });
            if (!putRes.ok) throw new Error("GitHub 上傳失敗");
            btn.innerText = "✅ 同步成功";
            setTimeout(() => { btn.innerText = originalText; btn.disabled = false; }, 2000);
        } catch (err) { alert("❌ 失敗: " + err.message); btn.innerText = originalText; btn.disabled = false; }
    }
</script>
</body>
</html>
