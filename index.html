<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSW 裝備提取管理器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #121214; --card-bg: #1c1c1f; --input-bg: #2a2a2e;
            --accent: #3b82f6; --success: #10b981; --price-green: rgb(102, 178, 127);
            --text-gray: #a0a0a0;
        }
        body { background-color: var(--bg-color); color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        h1 { color: #4ade80; display: flex; align-items: center; gap: 10px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #2d2d30; }
        .search-group { display: flex; gap: 10px; }
        input { flex: 1; background: var(--input-bg); border: 1px solid #3f3f46; padding: 10px; border-radius: 8px; color: white; }
        button { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .btn-blue { background: var(--accent); color: white; }
        .btn-green { background: var(--success); color: white; width: 100%; margin-top: 10px; }
        .error-msg { background: #451a1a; color: #f87171; padding: 12px; border-radius: 8px; margin-top: 15px; display: none; border-left: 4px solid #f87171; }
        .equip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 15px; padding: 10px 0; }
        .equip-slot { background: #000; width: 70px; height: 70px; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; border: 1px solid #333; }
        .equip-slot img { max-width: 55px; max-height: 55px; image-rendering: pixelated; }
        
        /* 彈窗樣式 */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card-bg); width: 380px; padding: 25px; border-radius: 20px; position: relative; }
        .preview-box { background: #000; height: 220px; border-radius: 12px; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        .preview-box img { max-width: 90%; max-height: 90%; image-rendering: pixelated; }
        .price-hint { color: var(--price-green); font-size: 11px; font-weight: bold; margin: 5px 0 15px 22px; }
        .copy-field { background: #2a2a32; padding: 8px 12px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; margin-left: 22px; margin-bottom: 12px; }
        .copy-field span { font-size: 13px; color: #ddd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .copy-icon { color: #f59e0b; cursor: pointer; margin-left: 10px; }
    </style>
</head>
<body>

    <h1><i class="fas fa-tshirt"></i> MSW 裝備提取管理器</h1>

    <div class="container">
        <div class="left-col">
            <div class="card">
                <div class="search-group">
                    <input type="text" id="searchInput" placeholder="輸入玩家 ID 或 5 碼代碼">
                    <button class="btn-blue" onclick="startScan()">開始掃描</button>
                </div>
                <div id="errorBox" class="error-msg"></div>
            </div>
            <div class="card">
                <div class="equip-grid" id="equipList">等待掃描...</div>
            </div>
        </div>

        <div class="right-col">
            <div class="card">
                <div style="font-size:13px; color:var(--text-gray);">Access Token</div>
                <input type="password" id="tokenInput">
                <div style="font-size:13px; color:var(--text-gray); margin-top:10px;">User ID (帳號別名)</div>
                <input type="text" id="userIdInput">
                <button class="btn-green" onclick="saveCredentials()">儲存憑證</button>
            </div>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <i class="fas fa-times" style="position:absolute; right:20px; top:20px; cursor:pointer;" onclick="closeModal()"></i>
            <div class="preview-box"><img id="mImg" src=""></div>
            <div style="padding-left:22px; margin-bottom:5px;" id="mName">名稱</div>
            <div class="price-hint" id="mPrice">當前價格: 載入中...</div>
            <div style="color:var(--text-gray); font-size:13px; margin-left:22px;">商品 ID</div>
            <div class="copy-field"><span id="mId"></span><i class="fas fa-file-signature copy-icon" onclick="copyValue('mId')"></i></div>
            <div style="color:var(--text-gray); font-size:13px; margin-left:22px;">縮圖</div>
            <div class="copy-field"><span id="mUrl"></span><i class="fas fa-file-signature copy-icon" onclick="copyValue('mUrl')"></i></div>
            <button style="background:#6366f1; color:white; width:100%; padding:12px; border-radius:10px; font-weight:bold;">🚀 同步至 GitHub</button>
        </div>
    </div>

    <script src="nexon_api.js"></script>
    <script>
        let scannedData = [];

        function saveCredentials() {
            const token = document.getElementById('tokenInput').value.trim();
            const userId = document.getElementById('userIdInput').value.trim();
            localStorage.setItem('msw_accounts_v1', JSON.stringify([{ userId, token }]));
            alert("儲存成功");
        }

        async function startScan() {
            const val = document.getElementById('searchInput').value.trim();
            const grid = document.getElementById('equipList');
            const err = document.getElementById('errorBox');
            
            if(!val) return;
            err.style.display = 'none';
            grid.innerHTML = '掃描中...';

            try {
                // 這裡會呼叫 nexon_api.js 裡的 NexonAPI
                scannedData = await window.NexonAPI.getEquipList(val);
                grid.innerHTML = '';
                scannedData.forEach((item, i) => {
                    const div = document.createElement('div');
                    div.className = 'equip-slot';
                    div.onclick = () => showDetail(i);
                    div.innerHTML = `<img src="${item.itemImageUrl}">`;
                    grid.appendChild(div);
                });
            } catch (e) {
                err.innerText = `❌ ${e.message}`;
                err.style.display = 'block';
                grid.innerHTML = '';
            }
        }

        function showDetail(index) {
            const item = scannedData[index];
            document.getElementById('mImg').src = item.itemImageUrl;
            document.getElementById('mName').innerText = item.itemName;
            document.getElementById('mId').innerText = item.itemId;
            document.getElementById('mUrl').innerText = item.itemImageUrl;
            
            // Godot 價格邏輯：current_price < 0 ? "未知" : "%d WC"
            const p = parseInt(item.targetPrice);
            document.getElementById('mPrice').innerText = `當前價格: ${ (p < 0 || isNaN(p)) ? "未知" : p + " WC" }`;
            
            document.getElementById('detailModal').classList.add('active');
        }

        function closeModal() { document.getElementById('detailModal').classList.remove('active'); }
        function copyValue(id) { navigator.clipboard.writeText(document.getElementById(id).innerText); }
    </script>
</body>
</html>
