<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSW 裝備提取管理器 Pro</title>
    <style>
        body { background-color: #0f0f12; color: #e4e4e7; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        input { background: #27272a; border: 1px solid #3f3f46; color: white; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; outline: none; }
        button { cursor: pointer; border: none; border-radius: 8px; padding: 12px; font-weight: 600; width: 100%; transition: 0.2s; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-save { background: #10b981; color: white; }

        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .item-card { background: #1c1c21; border-radius: 20px; padding: 24px; border: 1px solid #2d2d35; transition: transform 0.2s; position: relative; overflow: hidden; }
        .item-card:hover { transform: translateY(-5px); border-color: #4ade80; }
        
        .thumb-box { background: #141419; border-radius: 12px; height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; border: 1px solid #27272a; overflow: hidden; }
        .thumb-box img { max-width: 100%; max-height: 140px; image-rendering: pixelated; }

        /* %S 價格樣式：對應 Godot Color(0.4, 0.7, 0.5) */
        .price-text { font-size: 32px; color: rgb(102, 178, 127); font-weight: bold; margin-bottom: 15px; display: flex; align-items: baseline; gap: 4px; }
        .price-unit { font-size: 16px; color: #809980; font-weight: normal; }

        .info-row { display: flex; align-items: center; margin-bottom: 10px; font-size: 13px; }
        .info-label { color: #808ca6; width: 85px; flex-shrink: 0; }
        .info-value { color: #ffffff; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'Consolas', monospace; }
        
        .copy-btn { background: #2d2d35; color: #fb923c; width: 32px; height: 28px; padding: 0; font-size: 12px; margin-left: 8px; border-radius: 4px; flex-shrink: 0; }
        .btn-sync { background: #7359cc; color: white; margin-top: 15px; }
        
        #status-bar { padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid #3b82f633; }
    </style>
</head>
<body>

<div class="container">
    <header><h1 style="color: #4ade80;">👕 MSW 裝備管理器 Pro</h1></header>

    <div style="display: grid; grid-template-columns: 1fr 350px; gap: 24px;">
        <div class="left">
            <div class="card">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="target_input" placeholder="輸入 5 碼 ID 或 PPSN">
                    <button id="btn_search" class="btn-primary" style="width: 120px;">掃描裝備</button>
                </div>
                <div id="status-bar"></div>
            </div>
            <div id="equip_list" class="item-grid"></div>
        </div>

        <div class="right">
            <div class="card">
                <h3>🔑 憑證管理</h3>
                <input type="password" id="token_input" placeholder="AccessToken">
                <input type="text" id="userid_input" placeholder="UserId">
                <button id="btn_save" class="btn-save">💾 儲存並刷新</button>
            </div>
            <div class="card" style="font-size: 13px; color: #a1a1aa;">
                <p>💡 <b>提示：</b><br>價格 (%S) 抓取邏輯與 Godot 預購系統同步。如果顯示「未知」，通常代表該裝備為官方預設物或未在商城流通。</p>
            </div>
        </div>
    </div>
</div>

<script src="js/nexon_api.js"></script>

<script>
    const GITHUB_CONFIG = {
        token: "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",
        owner: "xmasakix",
        repo: "MSW-ID",
        path: "data.json"
    };

    function copy(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
            btn.innerText = "OK";
            setTimeout(() => btn.innerText = "📋", 1000);
        });
    }

    document.getElementById('btn_search').onclick = async function() {
        if (typeof window.NexonAPI === 'undefined') {
            alert("❌ 錯誤：找不到 NexonAPI 模組。");
            return;
        }

        const input = document.getElementById('target_input').value.trim();
        const status = document.getElementById('status-bar');
        const grid = document.getElementById('equip_list');

        if (!input) return;
        status.style.display = "block";
        status.innerText = "⏳ 正在抓取穿戴清單...";
        grid.innerHTML = "";

        try {
            const rawItems = await window.NexonAPI.getEquipList(input);
            
            if (!rawItems || rawItems.length === 0) {
                status.innerText = "⚠️ 找不到穿戴裝備。";
                return;
            }
            
            for (let item of rawItems) {
                status.innerText = `⏳ 正在抓取 %S 價格: ${item.itemName}...`;
                
                // 傳入 itemName 與 itemId 進行精確校對
                const realData = await window.NexonAPI.getRealProductDetail(item.itemName, item.itemId);
                
                // 純粹化價格處理：只拿 price，不拿狀態
                let rawPrice = realData ? realData.price : -1;
                let priceDisplay = (rawPrice < 0 || isNaN(rawPrice)) ? "未知" : `${rawPrice}`;
                let priceUnit = (rawPrice < 0 || isNaN(rawPrice)) ? "" : "wc";

                const displayData = {
                    name: item.itemName,
                    price: priceDisplay,
                    priceUnit: priceUnit,
                    itemId: (realData && realData.itemId) ? realData.itemId : item.itemId,
                    img: (realData && realData.img) ? realData.img : (item.itemImageUrl || item.itemThumbnailUrl),
                    author: (realData && realData.author) ? realData.author : "官方/未知"
                };

                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="thumb-box"><img src="${displayData.img}" onerror="this.src='https://via.placeholder.com/140?text=No+Image'"></div>          
                    <div class="info-row"><div class="info-label">📝 名稱</div><div class="info-value">${displayData.name}</div></div>
                    <div class="price-text">${displayData.price} <span class="price-unit">${displayData.priceUnit}</span></div>
                    <div class="info-row"><div class="info-label">👤 作者</div><div class="info-value">${displayData.author}</div></div>
                    <div class="info-row">
                        <div class="info-label">🆔 商品 ID</div>
                        <div class="info-value">${displayData.itemId}</div>
                        <button class="copy-btn" onclick="copy('${displayData.itemId}', this)">📋</button>
                    </div>
                    <button class="btn-sync">🚀 同步至 GitHub</button>
                `;

                card.querySelector('.btn-sync').onclick = (e) => sync(e.target, displayData);
                grid.appendChild(card);
            }
            status.innerText = `✅ %S 價格校對完成`;
        } catch (err) {
            status.innerText = "❌ 錯誤: " + err.message;
        }
    };

    async function sync(btn, data) {
        if (!data.itemId || data.itemId === "N/A") return alert("無效的商品 ID");
        btn.disabled = true;
        btn.innerText = "⏳ 同步中...";
        try {
            const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
            const res = await fetch(url, { headers: { "Authorization": `token ${GITHUB_CONFIG.token}` } });
            if (!res.ok) throw new Error("無法獲取 GitHub 資料");
            const json = await res.json();
            
            const list = JSON.parse(decodeURIComponent(escape(atob(json.content))));

            if (list.some(i => String(i.id) === String(data.itemId))) {
                throw new Error("此 ID 已存在");
            }

            list.push({
                "keyword": data.name,
                "wc": data.price === "未知" ? "未知" : data.price + "wc",
                "id": String(data.itemId),
                "img": data.img
            });

            const updateRes = await fetch(url, {
                method: "PUT",
                headers: { 
                    "Authorization": `token ${GITHUB_CONFIG.token}`, 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({
                    message: `Sync Price: ${data.name} (${data.price})`,
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(list, null, "\t")))),
                    sha: json.sha
                })
            });

            if (!updateRes.ok) throw new Error("GitHub 更新失敗");
            
            btn.innerText = "✅ 同步成功";
            btn.style.background = "#059669";
        } catch (err) {
            alert("同步失敗: " + err.message);
            btn.innerText = "🚀 同步失敗";
            btn.disabled = false;
        }
    }

    document.getElementById('btn_save').onclick = () => {
        const t = document.getElementById('token_input').value.trim();
        const u = document.getElementById('userid_input').value.trim();
        if (t && u) {
            localStorage.setItem('msw_accounts_v1', JSON.stringify([{userId: u, token: t}]));
            alert("憑證已儲存！");
            location.reload();
        }
    };
</script>
</body>
</html>
