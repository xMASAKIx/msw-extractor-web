<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSW 裝備提取管理器</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background-color: #0f0f12; color: white; font-family: sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #1a1a1e; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        input { background: #252529; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; }
        button { cursor: pointer; border: none; border-radius: 6px; padding: 12px; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn-primary { background: #3b82f6; color: white; margin-top: 10px; }
        .btn-save { background: #4ade80; color: #064e3b; margin-top: 10px; }
        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 15px; }
        #fetch-status { padding: 10px; border-radius: 6px; margin: 10px 0; display: none; font-size: 14px; }
        .status-error { background: rgba(248, 113, 113, 0.2); color: #f87171; border: 1px solid #f87171; display: block; }
        .status-success { background: rgba(74, 222, 128, 0.2); color: #4ade80; border: 1px solid #4ade80; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: #4ade80; text-align: center;">👕 MSW 提取工具</h1>

    <div class="card">
        <h3>🔑 憑證設定 (手動輸入)</h3>
        <div class="form-group">
            <label>Access Token</label>
            <input type="password" id="token_input" placeholder="貼上 mod-accesstoken">
        </div>
        <div class="form-group">
            <label>User ID (隨便取個名子也可以)</label>
            <input type="text" id="userid_input" placeholder="例如: MyAccount">
        </div>
        <button id="btn_save_manual" class="btn-save">💾 儲存憑證到瀏覽器</button>
        <div id="save-msg" style="text-align: center; margin-top: 10px; font-size: 12px;"></div>
    </div>

    <div class="card">
        <h3>🔍 玩家搜尋</h3>
        <input type="text" id="target_input" placeholder="輸入 #後5碼 (例如: 60531) 或 17碼 PPSN">
        <button id="btn_search" class="btn-primary">開始掃描裝備</button>
        <div id="fetch-status"></div>
    </div>

    <div class="card">
        <h3>📦 穿戴中的裝備</h3>
        <div id="equip_list" class="item-grid"></div>
    </div>
</div>

<script src="js/account_manager.js"></script>
<script src="js/nexon_api.js"></script>

<script>
    // --- 儲存功能 ---
    document.getElementById('btn_save_manual').onclick = function() {
        const token = document.getElementById('token_input').value.trim();
        const userid = document.getElementById('userid_input').value.trim() || "DefaultUser";
        const msg = document.getElementById('save-msg');

        if (token) {
            // 確保 AccountManager 有加載
            if (typeof AccountManager !== 'undefined') {
                AccountManager.saveAccount(userid, token);
                msg.style.color = "#4ade80";
                msg.innerText = "✅ 儲存成功！請重新整理頁面。";
                setTimeout(() => location.reload(), 800); 
            } else {
                alert("找不到 account_manager.js，請檢查檔案路徑");
            }
        } else {
            alert("請輸入 Token");
        }
    };

    // --- 搜尋功能 ---
    document.getElementById('btn_search').onclick = async function() {
        let input = document.getElementById('target_input').value.trim();
        const status = document.getElementById('fetch-status');
        const grid = document.getElementById('equip_list');

        if (!input) return;

        status.className = "status-success";
        status.innerText = "⏳ 讀取中...";
        status.style.display = "block";
        grid.innerHTML = "";

        try {
            // 自動轉換 5 碼
            if (input.length === 5 && !isNaN(input)) {
                const profile = await NexonAPI.getPpsnByCode(input);
                input = profile.ppsn;
            }

            const items = await NexonAPI.getEquipList(input);
            if (items.length === 0) throw new Error("找不到裝備資料");

            items.forEach(item => {
                const div = document.createElement('div');
                div.style.cssText = "background:#252529; padding:10px; border-radius:8px; text-align:center; border:1px solid #333;";
                div.innerHTML = `
                    <img src="${item.itemThumbnailUrl}" style="width:64px;">
                    <div style="font-size:10px; color:#aaa; margin:5px 0; word-break:break-all;">${item.ruid}</div>
                    <button onclick="navigator.clipboard.writeText('${item.ruid}');alert('已複製')" style="padding:5px; font-size:10px; background:#444; color:white;">複製 RUID</button>
                `;
                grid.appendChild(div);
            });
            status.innerText = `✅ 成功載入 ${items.length} 件裝備`;
        } catch (err) {
            status.className = "status-error";
            status.innerText = "❌ 失敗: " + err.message;
        }
    };
</script>

</body>
</html>
