<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MSW 裝備管理器 Pro</title>
    <script src="js/nexon_api.js"></script>
    <style>
        body { background-color: #0f0f12; color: #e4e4e7; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        
        /* 搜尋列：對齊優化 */
        .search-group { display: flex; gap: 10px; align-items: center; }
        input { 
            background: #27272a; border: 1px solid #3f3f46; color: white; 
            padding: 0 15px; border-radius: 8px; width: 100%; box-sizing: border-box; 
            outline: none; height: 45px; 
        }
        .btn-primary { 
            background: #3b82f6; color: white; cursor: pointer; border: none; 
            border-radius: 8px; font-weight: 600; width: 120px; transition: 0.2s;
            height: 45px; display: flex; align-items: center; justify-content: center;
        }
        
        /* 圖二：搜尋結果目標玩家資訊橫條 */
        .profile-bar { display: none; align-items: center; gap: 20px; background: #1c1c21; padding: 20px; border-radius: 15px; border: 1px solid #3b82f644; margin-bottom: 20px; }
        .profile-img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #3b82f6; object-fit: cover; background: #000; }
        .profile-data { display: flex; flex-direction: column; gap: 5px; }
        .p-name-row { display: flex; align-items: baseline; gap: 10px; }
        .p-name { font-size: 24px; font-weight: bold; color: #fff; }
        .p-code { font-size: 18px; color: #3b82f6; font-family: monospace; }
        .p-ppsn { font-size: 14px; color: #808ca6; }

        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .item-card { background: #1c1c21; border-radius: 20px; padding: 24px; border: 1px solid #2d2d35; }
        .thumb-box { background: #141419; border-radius: 12px; height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; overflow: hidden; }
        .thumb-box img { max-width: 100%; max-height: 140px; image-rendering: pixelated; }
        .price-text { font-size: 28px; color: rgb(102, 178, 127); font-weight: bold; margin-bottom: 15px; }
        .info-row { display: flex; align-items: center; margin-bottom: 10px; font-size: 13px; }
        .info-label { color: #808ca6; width: 85px; flex-shrink: 0; }
        .info-value { color: #ffffff; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'Consolas', monospace; }
        .copy-btn { background: #2d2d35; color: #fb923c; width: 32px; height: 28px; font-size: 12px; margin-left: 8px; border-radius: 4px; border:none; cursor:pointer;}
        .btn-sync { background: #7359cc; color: white; margin-top: 15px; width: 100%; padding: 12px; border-radius: 8px; border:none; cursor:pointer; font-weight:600;}
        
        #status-bar { padding: 12px; border-radius: 8px; margin-top: 15px; display: none; background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid #3b82f633; }
    </style>
</head>
<body>

<div class="container">
    <header><h1 style="color: #4ade80;">👕 MSW 裝備提取管理器 Pro</h1></header>
    <div style="display: grid; grid-template-columns: 1fr 350px; gap: 24px;">
        <div class="left">
            <div class="card">
                <div class="search-group">
                    <input type="text" id="target_input" placeholder="輸入 5 碼 ID 或 PPSN">
                    <button id="btn_search" class="btn-primary">掃描裝備</button>
                </div>
                <div id="status-bar"></div>
            </div>

            <div id="target_profile" class="profile-bar">
                <img id="p_img" src="" class="profile-img">
                <div class="profile-data">
                    <div class="p-name-row">
                        <span id="p_name" class="p-name">載入中...</span>
                        <span id="p_code" class="p-code"></span>
                    </div>
                    <div class="p-ppsn">PPSN: <span id="p_ppsn_val"></span></div>
                </div>
            </div>

            <div id="equip_list" class="item-grid"></div>
        </div>

        <div class="right">
            <div class="card">
                <h3>🔑 憑證管理</h3>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <h4 style="margin: 0; font-size: 12px; color: #808ca6;">Nexon 帳號</h4>
                    <input type="file" id="file_selector" accept=".json" style="display: none;">
                    <button onclick="document.getElementById('file_selector').click()" style="background: #3f3f46; color: #4ade80; border: 1px solid #4ade80; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;">📂 匯入 JSON</button>
                </div>
                <input type="password" id="token_input" placeholder="AccessToken" style="margin-bottom:10px;">
                <input type="text" id="userid_input" placeholder="UserId" style="margin-bottom:10px;">
                <p id="import_status" style="font-size: 11px; color: #4ade80; margin-top: -5px; margin-bottom: 10px; display: none;"></p>
                <hr style="border:0; border-top:1px solid #27272a; margin:15px 0;">
                <h4 style="font-size: 12px; color: #808ca6;">GitHub 配置</h4>
                <input type="password" id="gh_token_input" placeholder="GitHub Token" style="margin-bottom:10px;">
                <button id="btn_save" style="background: #10b981; color: white; width: 100%; padding:12px; border-radius:8px; border:none; cursor:pointer; font-weight:600;">💾 儲存所有憑證</button>
            </div>
        </div>
    </div>
</div>

<script>
    const GITHUB_CONFIG = { owner: "xmasakix", repo: "MSW-ID", path: "data.json" };

    window.onload = () => {
        const savedGhToken = localStorage.getItem('github_token_v1');
        if (savedGhToken) document.getElementById('gh_token_input').value = savedGhToken;
        const savedAccounts = localStorage.getItem('msw_accounts_v1');
        if (savedAccounts) {
            try {
                const accs = JSON.parse(savedAccounts);
                if (accs.length > 0) {
                    document.getElementById('token_input').value = accs[0].token || '';
                    document.getElementById('userid_input').value = accs[0].userId || '';
                }
            } catch(e) {}
        }
        initImportFeature();
    };

    document.getElementById('target_input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('btn_search').click();
    });

    document.getElementById('btn_search').onclick = async function() {
        const input = document.getElementById('target_input').value.trim();
        const status = document.getElementById('status-bar');
        const grid = document.getElementById('equip_list');
        const pBar = document.getElementById('target_profile');

        if (!input) return;
        status.style.display = "block";
        status.innerText = "🔄 正在獲取資料...";
        grid.innerHTML = "";
        pBar.style.display = "none";

        try {
            // 執行獲取玩家資訊
            await fetchTargetProfile(input);

            const rawItems = await NexonAPI.getEquipList(input);
            if (!rawItems || rawItems.length === 0) {
                status.innerText = "⚠️ 找不到裝備";
                return;
            }
            for (let item of rawItems) {
                const realData = await NexonAPI.getRealProductDetail(item.itemId || item.itemName);
                renderCard(item, realData, grid);
            }
            status.innerText = `✅ 提取完成 (${new Date().toLocaleTimeString()})`;
        } catch (err) { status.innerText = "❌ 錯誤: " + err.message; }
    };

    // 修正：確實將 API 回傳資料填入圖二橫條
    async function fetchTargetProfile(idOrPpsn) {
        try {
            const response = await fetch(`https://mverse-api.nexon.com/social/v1/profile/${idOrPpsn}`);
            const json = await response.json();
            
            // 根據 API 結構提取資料
            const p = json.data;
            if (p) {
                document.getElementById('p_img').src = p.profileImageUrl || '';
                document.getElementById('p_name').innerText = p.profileName || '未知玩家';
                document.getElementById('p_code').innerText = `#${p.profileCode || ''}`;
                document.getElementById('p_ppsn_val').innerText = p.ppsn || idOrPpsn;
                document.getElementById('target_profile').style.display = "flex";
            }
        } catch (e) {
            console.error("Profile API 錯誤:", e);
        }
    }

    function renderCard(item, real, container) {
        const d = {
            name: item.itemName,
            price: real?.price !== undefined ? real.price : "未知",
            itemId: real?.itemId || item.itemId || "未上架",
            img: item.itemImageUrl || item.itemThumbnailUrl,
            author: (real && real.profileCode) ? `${real.nickname}#${real.profileCode}` : (real?.nickname || "未上架"),
            sellerPpsn: real?.sellerPpsn || ""
        };

        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
            <div class="thumb-box"><img src="${d.img}"></div>
            <div class="info-row">
                <div class="info-label">📝 名稱</div>
                <div class="info-value">${d.name}</div>
                <button class="copy-btn" onclick="copy('${d.name}', this)">📋</button>
            </div>
            <div class="price-text">${d.price} <span style="font-size:14px;color:#888">wc</span></div>
            <div class="info-row">
                <div class="info-label">👤 作者</div>
                <div class="info-value">${d.author}</div>
                <button class="copy-btn" onclick="copy('${d.author}', this)">📋</button>
            </div>
            <div class="info-row">
                <div class="info-label">🆔 商品 ID</div>
                <div class="info-value">${d.itemId}</div>
                <button class="copy-btn" onclick="copy('${d.itemId}', this)">📋</button>
            </div>
            <div class="info-row">
                <div class="info-label">🖼️ 縮圖網址</div>
                <div class="info-value">${d.img}</div>
                <button class="copy-btn" onclick="copy('${d.img}', this)">📋</button>
            </div>
            <button class="btn-sync">🚀 同步至 GitHub</button>
        `;
        card.querySelector('.btn-sync').onclick = (e) => syncToGithub(e.target, d);
        container.appendChild(card);
    }

    async function syncToGithub(btn, data) {
        const originalText = btn.innerText;
        btn.innerText = "⏳ 同步中...";
        btn.disabled = true;
        try {
            const token = localStorage.getItem('github_token_v1');
            if (!token) throw new Error("請先儲存 GitHub Token");
            const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
            const headers = { "Authorization": `Bearer ${token.trim()}`, "Accept": "application/vnd.github.v3+json" };

            const res = await fetch(url, { headers });
            let sha = ""; let items = [];
            if (res.ok) {
                const file = await res.json();
                sha = file.sha;
                items = JSON.parse(decodeURIComponent(escape(atob(file.content.replace(/\s/g, '')))));
            }

            const newItem = { "id": String(data.itemId), "img": data.img, "keyword": data.name, "wc": parseInt(data.price) || 0, "author": String(data.sellerPpsn) };
            const idx = items.findIndex(i => String(i.id) === newItem.id);
            if (idx > -1) items[idx] = newItem; else items.push(newItem);

            const putRes = await fetch(url, {
                method: "PUT",
                headers: { ...headers, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: `📦 Update: ${newItem.keyword}`,
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(items, null, 2)))),
                    sha: sha
                })
            });
            if (!putRes.ok) throw new Error("GitHub 上傳失敗");
            btn.innerText = "✅ 同步成功";
            setTimeout(() => { btn.innerText = originalText; btn.disabled = false; }, 2000);
        } catch (err) { alert(err.message); btn.innerText = originalText; btn.disabled = false; }
    }

    function initImportFeature() {
        document.getElementById('file_selector').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const json = JSON.parse(event.target.result);
                    const acc = (json.accounts || []).find(a => a.user_id === json.current_account);
                    if (acc) {
                        document.getElementById('token_input').value = acc.access_token;
                        document.getElementById('userid_input').value = acc.user_id;
                        document.getElementById('import_status').innerText = `✅ 已載入：${acc.nickname}`;
                        document.getElementById('import_status').style.display = 'block';
                        localStorage.setItem('msw_accounts_v1', JSON.stringify([{userId: acc.user_id, token: acc.access_token}]));
                    }
                } catch (e) { alert('解析失敗'); }
            };
            reader.readAsText(file);
        };
    }

    document.getElementById('btn_save').onclick = () => {
        const nt = document.getElementById('token_input').value.trim();
        const nu = document.getElementById('userid_input').value.trim();
        const gt = document.getElementById('gh_token_input').value.trim();
        if (nt && nu) localStorage.setItem('msw_accounts_v1', JSON.stringify([{userId: nu, token: nt}]));
        if (gt) localStorage.setItem('github_token_v1', gt);
        alert("儲存成功！");
    };

    function copy(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
            const old = btn.innerText; btn.innerText = "OK";
            setTimeout(() => btn.innerText = old, 1000);
        });
    }
</script>
</body>
</html>
