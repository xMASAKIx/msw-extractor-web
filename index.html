<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSW 裝備管理面板</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #121216;
            --card-bg: #1e1e24;
            --text-color: #ffffff;
            --accent-color: #7e69f5;
            /* 對應 Godot 中的 Color(0.4, 0.7, 0.5) */
            --price-hint-color: rgb(102, 178, 127); 
            --label-color: #a0a0a0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Microsoft JhengHei", sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .modal-card {
            background: var(--card-bg);
            width: 380px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .close-btn {
            position: absolute;
            right: 20px; top: 20px;
            color: var(--label-color);
            cursor: pointer;
            font-size: 20px;
        }

        .preview-box {
            background: #000000;
            width: 100%; height: 220px;
            border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 20px;
        }

        .preview-box img {
            max-width: 100%; max-height: 100%;
            image-rendering: pixelated;
        }

        .info-row {
            margin-bottom: 12px;
            display: flex; flex-direction: column;
        }

        .label {
            color: var(--label-color);
            font-size: 14px;
            margin-bottom: 4px;
        }

        /* 價格顯示：完全對照 Godot 樣式 */
        .price-hint {
            color: var(--price-hint-color);
            font-size: 11px; /* font_size 11 */
            font-weight: bold;
            margin-bottom: 16px;
        }

        .copy-wrapper {
            display: flex; align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px; border-radius: 6px;
        }

        .truncate {
            flex: 1; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
            font-size: 14px;
        }

        .copy-icon {
            color: #ffa726; cursor: pointer;
            margin-left: 10px;
        }

        .sync-btn {
            background: var(--accent-color);
            color: white; border: none;
            width: 100%; padding: 14px;
            border-radius: 10px; font-weight: bold;
            cursor: pointer; margin-top: 10px;
            display: flex; justify-content: center; gap: 8px;
        }
    </style>
</head>
<body>

<div class="modal-card">
    <i class="fas fa-times close-btn"></i>

    <div class="preview-box">
        <img id="detailImg" src="" alt="">
    </div>

    <div class="info-row">
        <span class="label"><i class="fas fa-file-alt"></i> 商品名稱</span>
        <span class="value" id="detailName">載入中...</span>
    </div>

    <div class="price-hint" id="priceHint">
        當前價格: 載入中...
    </div>

    <div class="info-row">
        <span class="label"><i class="fas fa-user-tag"></i> 作者</span>
        <span id="detailAuthor">未知</span>
    </div>

    <div class="info-row">
        <span class="label"><i class="fas fa-fingerprint"></i> 商品 ID</span>
        <div class="copy-wrapper">
            <span class="truncate" id="detailId">N/A</span>
            <i class="fas fa-file-signature copy-icon" onclick="copyValue('detailId')"></i>
        </div>
    </div>

    <div class="info-row">
        <span class="label"><i class="fas fa-link"></i> 縮圖</span>
        <div class="copy-wrapper">
            <span class="truncate" id="detailThumbUrl">N/A</span>
            <i class="fas fa-file-signature copy-icon" onclick="copyValue('detailThumbUrl')"></i>
        </div>
    </div>

    <button class="sync-btn">🚀 同步至 GitHub</button>
</div>

<script>
    /**
     * 渲染函數：完全套用 Godot 的價格判斷邏輯
     */
    function renderItemDetail(item) {
        // 1. 處理價格文字 (current_price < 0 ? "未知" : "%d WC")
        const current_price = parseInt(item.targetPrice); 
        let priceText = "";
        
        if (isNaN(current_price) || current_price < 0) {
            priceText = "當前價格: 未知";
        } else {
            priceText = `當前價格: ${current_price} WC`;
        }
        
        document.getElementById('priceHint').innerText = priceText;

        // 2. 填充其餘資料
        document.getElementById('detailImg').src = item.itemImageUrl;
        document.getElementById('detailName').innerText = item.itemName;
        document.getElementById('detailAuthor').innerText = item.nickname || "未知";
        document.getElementById('detailId').innerText = item.itemId;
        document.getElementById('detailThumbUrl').innerText = item.itemImageUrl;
    }

    function copyValue(id) {
        const text = document.getElementById(id).innerText;
        navigator.clipboard.writeText(text);
    }

    // 模擬從 API 獲取資料後的調用
    // renderItemDetail({
    //     itemName: "ɩKiana",
    //     targetPrice: "15",
    //     itemImageUrl: "...",
    //     itemId: "BKDH6CEBF"
    // });
</script>

</body>
</html>
