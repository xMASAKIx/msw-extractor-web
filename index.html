<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSW Extractor - 控制中心</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --panel-bg: #1a1a24;
            --accent-color: #4a90e2;
            --success-color: #2ecc71;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }
        .header { margin-bottom: 40px; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; color: var(--accent-color); }
        .header p { color: var(--text-dim); }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }
        .menu-card {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .menu-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .icon { font-size: 3rem; margin-bottom: 15px; }
        .menu-card h3 { margin: 10px 0; }
        .menu-card p { font-size: 0.9rem; color: var(--text-dim); text-align: center; }

        .token-status {
            margin-top: 40px;
            padding: 20px;
            background: rgba(74, 144, 226, 0.1);
            border-radius: 10px;
            border-left: 4px solid var(--accent-color);
            text-align: left;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge-ok { background: var(--success-color); color: black; }
        .badge-err { background: #e74c3c; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>MSW Extractor</h1>
        <p>楓之谷世界資源提取工具 (網頁版)</p>
    </div>

    <div class="menu-grid">
        <a href="admin.html" class="menu-card">
            <div class="icon">👕</div>
            <h3>裝備提取器</h3>
            <p>輸入 PPSN 搜尋玩家穿戴中的裝備，並複製 RUID 資源代碼。</p>
        </a>

        <a href="#" class="menu-card" onclick="alert('功能開發中...')">
            <div class="icon">👥</div>
            <h3>好友觀察室</h3>
            <p>查看好友線上狀態及裝備資訊，快速跳轉搜尋。</p>
        </a>

        <a href="https://github.com/你的帳號/你的專案" target="_blank" class="menu-card">
            <div class="icon">🤖</div>
            <h3>Playwright 助手</h3>
            <p>前往 GitHub 下載自動化獲取 Token 腳本。</p>
        </a>
    </div>

    <div class="token-status" id="status-panel">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <strong>憑證狀態回報</strong>
            <span id="status-badge" class="badge badge-err">未檢測到憑證</span>
        </div>
        <p id="token-preview" style="font-size: 0.85rem; color: var(--text-dim); margin-top: 10px;">
            請進入「裝備提取器」頁面設定 Access Token 與 User ID。
        </p>
    </div>
</div>

<script>
    // 檢查本地存儲的狀態
    function checkStatus() {
        const token = localStorage.getItem('msw_token');
        const userId = localStorage.getItem('msw_user_id');
        const badge = document.getElementById('status-badge');
        const preview = document.getElementById('token-preview');

        if (token && userId) {
            badge.className = 'badge badge-ok';
            badge.innerText = '憑證已就緒';
            preview.innerHTML = `
                當前帳號 ID: <code>${userId.substring(0, 15)}...</code><br>
                Token 預覽: <code>${token.substring(0, 20)}...</code>
            `;
        } else {
            badge.className = 'badge badge-err';
            badge.innerText = '憑證缺失';
            preview.innerText = '偵測不到登入資訊，請先完成憑證設定。';
        }
    }

    // 每秒檢查一次 (模擬 Godot 的 _process 或訊號)
    setInterval(checkStatus, 2000);
    checkStatus();
</script>

</body>
</html>
