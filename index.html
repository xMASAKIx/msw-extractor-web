<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSW 裝備提取管理器</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 保留你喜歡的深色精緻風格 */
        body { background-color: #0f0f12; color: #e4e4e7; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { color: #4ade80; display: flex; align-items: center; gap: 10px; }
        
        /* 佈局：左側功能，右側面板 */
        .main-layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; margin-top: 20px; }
        .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h3 { margin-top: 0; font-size: 1.1rem; color: #f4f4f5; display: flex; align-items: center; gap: 8px; }

        /* 輸入框與按鈕 */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; color: #a1a1aa; margin-bottom: 6px; }
        input { background: #27272a; border: 1px solid #3f3f46; color: white; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; outline: none; transition: border 0.2s; }
        input:focus { border-color: #3b82f6; }
        
        button { cursor: pointer; border: none; border-radius: 8px; padding: 12px; font-weight: 600; width: 100%; transition: all 0.2s; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-save { background: #10b981; color: white; margin-top: 10px; }
        .btn-save:hover { background: #059669; }

        /* 裝備網格 */
        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; min-height: 200px; }
        .item-card { background: #27272a; border: 1px solid #3f3f46; border-radius: 10px; padding: 12px; text-align: center; }
        .item-card img { width: 64px; height: 64px; object-fit: contain; background: #18181b; border-radius: 6px; margin-bottom: 10px; }
        .ruid-text { font-family: monospace; font-size: 10px; color: #a1a1aa; word-break: break-all; margin: 8px 0; }
        
        /* 狀態條 */
        #fetch-status { padding: 12px; border-radius: 8px; margin: 15px 0; font-size: 0.9rem; display: none; }
        .status-success { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); display: block; }
        .status-error { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); display: block; }

        /* 帳號清單樣式 */
        .account-item { background: #27272a; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 0.9rem; cursor: pointer; border: 1px solid transparent; }
        .account-item:hover { border-color: #3b82f6; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><span style="font-size: 2rem;">👕</span> MSW 裝備提取管理器</h1>
        <p style="color: #71717a; margin-top: -10px;">輸入 #後5碼 或 完整 PPSN 即可掃描 RUID</p>
    </header>

    <div class="main-layout">
        <div class="left-panel">
            <div class="card">
                <h3>🔍 玩家搜尋</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="target_input" placeholder="例如: 60531 或 20372...">
                    <button id="btn_search" class="btn-primary" style="width: 120px;">開始掃描</button>
                </div>
                <div id="fetch-status"></div>
            </div>

            <div class="card">
                <h3>📦 穿戴中的裝備</h3>
                <div id="equip_list" class="item-grid">
                    <p style="color: #52525b; grid-column: 1/-1; text-align: center; padding: 50px;">等待掃描指令...</p>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="card">
                <h3>🔑 憑證設定</h3>
                <div class="form-group">
                    <label>Access Token</label>
                    <input type="password" id="token_input" placeholder="貼上 mod-accesstoken">
                </div>
                <div class="form-group">
                    <label>User ID (帳號別名)</label>
                    <input type="text" id="userid_input" placeholder="例如: 主要帳號">
                </div>
                <button id="btn_save_manual" class="btn-save">💾 儲存憑證</button>
            </div>

            <div class="card">
                <h3>👥 已儲存帳號</h3>
                <div id="saved_accounts_list">
                    </div>
            </div>
        </div>
    </div>
</div>

<script src="js/account_manager.js"></script>
<script src="js/nexon_api.js"></script>

<script>
    // --- 儲存帳號邏輯 (核心修復) ---
    document.getElementById('btn_save_manual').onclick = function() {
    const tokenInput = document.getElementById('token_input');
    const userInput = document.getElementById('userid_input');
    
    const token = tokenInput.value.trim();
    const userId = userInput.value.trim() || "未命名帳號";

    if (token) {
        // 執行儲存
        AccountManager.saveAccount(userId, token);
        
        // 清空輸入框 (選選)
        tokenInput.value = "";
        userInput.value = "";
        
        alert(`✅ 帳號「${userId}」已儲存！`);
    } else {
        alert("❌ 請輸入 Access Token");
    }
};

    // --- 搜尋裝備邏輯 ---
    document.getElementById('btn_search').onclick = async function() {
        let input = document.getElementById('target_input').value.trim();
        const statusBox = document.getElementById('fetch-status');
        const grid = document.getElementById('equip_list');

        if (!input) return;

        statusBox.className = "status-success";
        statusBox.innerText = "⏳ 正在處理...";
        statusBox.style.display = "block";
        grid.innerHTML = "";

        try {
            // 處理 5 碼 Profile Code 自動轉換
            if (input.length === 5 && !isNaN(input)) {
                statusBox.innerText = "🔍 正在轉換 5 碼 ID...";
                const profile = await NexonAPI.getPpsnByCode(input);
                input = profile.ppsn;
                statusBox.innerText = `✨ 找到玩家: ${profile.profileName}，抓取裝備中...`;
            }

            const items = await NexonAPI.getEquipList(input);
            
            if (items.length === 0) {
                statusBox.className = "status-error";
                statusBox.innerText = "ℹ️ 該玩家目前沒有穿戴可提取的裝備";
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <img src="${item.itemThumbnailUrl}">
                    <div style="font-size: 11px; color: #4ade80; font-weight: bold;">${item.avatarType}</div>
                    <div class="ruid-text">${item.ruid}</div>
                    <button onclick="copyText('${item.ruid}')" style="padding: 6px; font-size: 11px; background: #3f3f46; color: white;">複製 RUID</button>
                `;
                grid.appendChild(card);
            });

            statusBox.innerText = `✅ 成功載入 ${items.length} 件裝備`;

        } catch (err) {
            statusBox.className = "status-error";
            statusBox.innerText = "❌ 失敗: " + err.message;
        }
    };

    function copyText(text) {
        navigator.clipboard.writeText(text);
        alert("已複製 RUID");
    }

    // 頁面載入時，如果 account_manager 有提供渲染清單的功能，可以在此呼叫
</script>

</body>
</html>
