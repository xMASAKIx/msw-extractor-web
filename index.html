<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSW 裝備提取管理器</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 這裡可以放一些簡單的頁面微調 */
        .status-bar {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 14px;
            display: none; /* 預設隱藏 */
        }
        .status-success { background: #1e3a2f; color: #4ade80; display: block; }
        .status-error { background: #451a1a; color: #f87171; display: block; }
        
        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .item-card {
            background: #252529;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }
        .thumb-container img {
            width: 64px;
            height: 64px;
            object-fit: contain;
        }
        .ruid-text {
            font-family: monospace;
            font-size: 11px;
            color: #aaa;
            margin: 5px 0;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <header style="margin-bottom: 30px;">
        <h1>👕 MSW 裝備提取管理器</h1>
        <p style="color: #888;">輸入玩家 Profile Code (#後5碼) 或完整 PPSN</p>
    </header>

    <div class="main-layout">
        <div class="content-area">
            <div class="card search-box">
                <h3>🔍 玩家搜尋</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="target_input" placeholder="例如: 60531 或 203721..." style="flex: 1;">
                    <button id="btn_search" class="btn-primary">開始掃描</button>
                </div>
            </div>

            <div id="fetch-status" class="status-bar"></div>

            <div class="card result-box">
                <h3>📦 穿戴中的裝備</h3>
                <div id="equip_list" class="item-grid">
                    <p style="color: #666; grid-column: 1/-1; text-align: center;">請在上方輸入 ID 並點擊掃描獲取資料</p>
                </div>
            </div>
        </div>

        <div class="side-panel">
            <div class="card">
                <h3>🔑 憑證設定</h3>
                <div class="form-group">
                    <label>Access Token</label>
                    <input type="password" id="token_input" placeholder="貼上你的 Token">
                </div>
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" id="userid_input" placeholder="貼上你的 User ID">
                </div>
                <button id="btn_save_manual" class="btn-secondary" style="width: 100%; margin-bottom: 10px;">💾 手動儲存憑證</button>
                <button id="btn_import_json" class="btn-success" style="width: 100%;">📥 匯入 Token JSON</button>
                <input type="file" id="file_selector" style="display: none;" accept=".json">
            </div>

            <div class="card">
                <h3>👥 已儲存帳號</h3>
                <div id="saved_accounts_list">
                    </div>
            </div>
        </div>
    </div>
</div>

<script src="js/account_manager.js"></script>
<script src="js/nexon_api.js"></script>

<script>
    // 綁定搜尋按鈕
    document.getElementById('btn_search').addEventListener('click', fetchPlayerEquips);

    // 處理搜尋與轉換邏輯
    async function fetchPlayerEquips() {
        let inputVal = document.getElementById('target_input').value.trim();
        const statusBox = document.getElementById('fetch-status');
        const grid = document.getElementById('equip_list');

        if (!inputVal) return alert("請輸入 ID 或 PPSN");

        // 顯示載入狀態
        statusBox.className = "status-bar status-success";
        statusBox.innerText = "⏳ 正在處理中...";
        grid.innerHTML = "";

        try {
            let finalPpsn = inputVal;

            // --- 自動轉換邏輯 (5 碼處理) ---
            if (inputVal.length === 5 && !isNaN(inputVal)) {
                statusBox.innerText = `🔍 正在轉換 5 碼 ID: #${inputVal}...`;
                const playerData = await NexonAPI.getPpsnByCode(inputVal);
                finalPpsn = playerData.ppsn;
                statusBox.innerText = `✨ 找到玩家: ${playerData.profileName}，正在抓取裝備...`;
            }

            // 執行提取裝備
            const items = await NexonAPI.getEquipList(finalPpsn);

            if (items.length === 0) {
                statusBox.className = "status-bar status-error";
                statusBox.innerText = "ℹ️ 找不到該玩家或其未穿戴造型裝備";
                grid.innerHTML = '<p style="color: #666; grid-column: 1/-1; text-align: center;">無穿戴資料</p>';
                return;
            }

            // 渲染結果卡片
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="thumb-container">
                        <img src="${item.itemThumbnailUrl}" alt="icon">
                    </div>
                    <div class="item-info">
                        <span style="font-size: 10px; color: #4ade80;">${item.avatarType}</span>
                        <div class="ruid-text">${item.ruid}</div>
                        <button onclick="copyToClipboard('${item.ruid}')" style="font-size: 10px; cursor: pointer; padding: 2px 5px;">複製 RUID</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            statusBox.className = "status-bar status-success";
            statusBox.innerText = `✅ 成功載入 ${items.length} 件裝備`;

        } catch (err) {
            statusBox.className = "status-bar status-error";
            statusBox.innerText = "❌ 錯誤: " + (err.message === "UNAUTHORIZED" ? "憑證過期，請更新 Token" : err.message);
        }
    }

    // 複製功能
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert("RUID 已複製到剪貼簿");
        });
    }

    // 憑證匯入與儲存邏輯 (對接 account_manager.js)
    document.getElementById('btn_import_json').onclick = () => document.getElementById('file_selector').click();
    
    document.getElementById('file_selector').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const data = JSON.parse(event.target.result);
            AccountManager.saveAccount(data.user_id, data.token);
            location.reload(); // 重新整理載入新帳號
        };
        reader.readAsText(file);
    };

    document.getElementById('btn_save_manual').onclick = () => {
        const token = document.getElementById('token_input').value.trim();
        const userid = document.getElementById('userid_input').value.trim();
        if (token && userid) {
            AccountManager.saveAccount(userid, token);
            alert("憑證已手動儲存");
            location.reload();
        } else {
            alert("請填寫完整的 Token 與 User ID");
        }
    };
</script>

</body>
</html>
