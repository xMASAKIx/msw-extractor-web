<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSW 裝備提取管理器</title>
    <style>
        body { background-color: #0f0f12; color: #e4e4e7; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .main-layout { display: grid; grid-template-columns: 1fr 350px; gap: 24px; margin-top: 20px; }
        .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        input { background: #27272a; border: 1px solid #3f3f46; color: white; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; outline: none; }
        button { cursor: pointer; border: none; border-radius: 8px; padding: 12px; font-weight: 600; width: 100%; transition: 0.2s; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-save { background: #10b981; color: white; }

        /* 裝備卡片排版 */
        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .item-card { background: #1c1c21; border-radius: 20px; padding: 24px; border: 1px solid #2d2d35; }
        .thumb-box { background: #141419; border-radius: 12px; height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; border: 1px solid #27272a; }
        .thumb-box img { max-width: 100%; max-height: 140px; image-rendering: pixelated; }

        .price-text { font-size: 28px; color: #66d981; font-weight: bold; margin-bottom: 15px; display: flex; align-items: baseline; gap: 4px; }
        .price-unit { font-size: 14px; color: #809980; }

        .info-row { display: flex; align-items: center; margin-bottom: 10px; font-size: 14px; }
        .info-label { color: #808ca6; width: 90px; flex-shrink: 0; }
        .info-value { color: #ffffff; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'Consolas', monospace; }
        
        /* 獨立複製按鈕樣式 */
        .copy-btn-inline { background: #2d2d35; color: #fb923c; width: 36px; height: 32px; padding: 0; font-size: 14px; margin-left: 8px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .copy-btn-inline:hover { background: #fb923c; color: #1c1c21; }
        
        .btn-sync { background: #7359cc; color: white; margin-top: 15px; font-size: 15px; }
        .btn-sync:disabled { opacity: 0.5; cursor: not-allowed; }

        #fetch-status { padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .status-success { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid #10b98133; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 style="color: #4ade80;">👕 MSW 裝備提取管理器</h1>
    </header>

    <div class="main-layout">
        <div class="left-panel">
            <div class="card">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="target_input" placeholder="輸入玩家 5 碼 ID 或 PPSN">
                    <button id="btn_search" class="btn-primary" style="width: 120px;">開始掃描</button>
                </div>
                <div id="fetch-status"></div>
            </div>
            <div id="equip_list" class="item-grid"></div>
        </div>

        <div class="right-panel">
            <div class="card">
                <h3>🔑 憑證設定</h3>
                <input type="password" id="token_input" placeholder="Nexon Access Token">
                <input type="text" id="userid_input" placeholder="帳號別名">
                <button id="btn_save_manual" class="btn-save">💾 儲存憑證</button>
            </div>
        </div>
    </div>
</div>

<script src="js/account_manager.js"></script>
<script src="js/nexon_api.js"></script>

<script>
    const GITHUB_CONFIG = {
        token: "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",
        owner: "xmasakix",
        repo: "MSW-ID",
        path: "data.json"
    };

    // 解決複製問題的穩定函式
    function execCopy(text, btn) {
        if (!text) return;
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        try {
            document.execCommand('copy');
            const ori = btn.innerText;
            btn.innerText = "✅";
            setTimeout(() => btn.innerText = ori, 1000);
        } catch (err) {
            console.error('複製失敗', err);
        }
        document.body.removeChild(el);
    }

    document.getElementById('btn_search').onclick = async function() {
        const input = document.getElementById('target_input').value.trim();
        const statusBox = document.getElementById('fetch-status');
        const grid = document.getElementById('equip_list');

        if (!input) return;
        statusBox.className = "status-success";
        statusBox.innerText = "⏳ 讀取中...";
        statusBox.style.display = "block";
        grid.innerHTML = "";

        try {
            const items = await NexonAPI.getEquipList(input);
            
            items.forEach(item => {
                // 精確校對欄位：優先取 itemId (商品ID), targetPrice (價格)
                const itemName = item.itemName || item.name || "未命名";
                const price = (item.targetPrice !== undefined) ? item.targetPrice : (item.itemPrice || 0);
                const itemId = item.itemId || item.id || item.ruid || ""; 
                const imgUrl = item.itemImageUrl || item.itemThumbnailUrl || "";
                const author = item.nickname || item.profileName || "未知";

                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="thumb-box"><img src="${imgUrl}"></div>
                    <div class="price-text">${price} <span class="price-unit">wc</span></div>
                    
                    <div class="info-row">
                        <div class="info-label">📝 商品名稱</div>
                        <div class="info-value">${itemName}</div>
                        <button class="copy-btn-inline" data-val="${itemName}">📋</button>
                    </div>
                    <div class="info-row">
                        <div class="info-label">👤 作者</div>
                        <div class="info-value">${author}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">🆔 商品 ID</div>
                        <div class="info-value">${itemId}</div>
                        <button class="copy-btn-inline" data-val="${itemId}">📋</button>
                    </div>
                    <div class="info-row">
                        <div class="info-label">🔗 縮圖</div>
                        <div class="info-value">${imgUrl}</div>
                        <button class="copy-btn-inline" data-val="${imgUrl}">📋</button>
                    </div>
                    <button class="btn-sync">🚀 同步至 GitHub</button>
                `;

                // 綁定複製
                card.querySelectorAll('.copy-btn-inline').forEach(b => {
                    b.onclick = () => execCopy(b.getAttribute('data-val'), b);
                });

                // 綁定同步
                const sBtn = card.querySelector('.btn-sync');
                sBtn.onclick = () => startSync(sBtn, { itemName, price, itemId, imgUrl });

                grid.appendChild(card);
            });
            statusBox.innerText = `✅ 掃描完成，共 ${items.length} 件裝備`;
        } catch (err) {
            statusBox.innerText = "❌ 錯誤: " + err.message;
        }
    };

    async function startSync(btn, data) {
        btn.disabled = true;
        btn.innerText = "⏳ 處理中...";
        try {
            const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
            const res = await fetch(url, { headers: { "Authorization": `token ${GITHUB_CONFIG.token}` } });
            const json = await res.json();
            const list = JSON.parse(decodeURIComponent(escape(atob(json.content))));

            if (list.some(i => String(i.id) === String(data.itemId))) throw new Error("ID 已存在");

            list.push({
                "keyword": data.itemName,
                "wc": parseInt(data.price) < 0 ? "不限價格" : data.price + "wc",
                "id": String(data.itemId),
                "img": data.imgUrl
            });

            await fetch(url, {
                method: "PUT",
                headers: { "Authorization": `token ${GITHUB_CONFIG.token}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: `Add: ${data.itemName}`,
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(list, null, "\t")))),
                    sha: json.sha
                })
            });

            btn.innerText = "✅ 同步成功";
        } catch (err) {
            alert(err.message);
            btn.innerText = "🚀 同步至 GitHub";
            btn.disabled = false;
        }
    }

    document.getElementById('btn_save_manual').onclick = function() {
        const t = document.getElementById('token_input').value;
        const u = document.getElementById('userid_input').value;
        if (t) AccountManager.saveAccount(u, t);
    };
</script>
</body>
</html>
